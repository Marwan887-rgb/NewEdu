<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض تقدم الطلاب</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-7xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
      <h1 class="text-3xl font-bold text-indigo-700 mb-6 text-center">📊 تقدم الطلاب</h1>
      
      <div class="flex gap-4 mb-6">
        <button onclick="loadProgress()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition">
          🔄 تحديث البيانات
        </button>
        <button onclick="clearAllProgress()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition">
          🗑️ حذف جميع السجلات
        </button>
      </div>

      <div id="stats" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <!-- الإحصائيات -->
      </div>

      <div id="progressContainer" class="space-y-4">
        <p class="text-center text-gray-500">جارٍ التحميل...</p>
      </div>
    </div>
  </div>

  <script>
    // إعدادات Supabase
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // تحميل سجلات التقدم
    async function loadProgress() {
      const container = document.getElementById('progressContainer');
      const statsContainer = document.getElementById('stats');
      container.innerHTML = '<p class="text-center text-gray-500">جارٍ التحميل...</p>';

      try {
        const { data, error } = await supabase
          .from('progress')
          .select('*')
          .order('timestamp', { ascending: false });

        if (error) {
          container.innerHTML = `<p class="text-center text-red-500">❌ خطأ: ${error.message}</p>`;
          return;
        }

        if (!data || data.length === 0) {
          container.innerHTML = '<p class="text-center text-gray-500">😴 لا توجد سجلات حتى الآن</p>';
          statsContainer.innerHTML = '';
          return;
        }

        // حساب الإحصائيات
        const stats = {
          total: data.length,
          students: new Set(data.map(p => p.student_mobile)).size,
          lessons: new Set(data.map(p => p.lesson_id)).size,
          tasks: {
            lesson: data.filter(p => p.task === 'lesson').length,
            video: data.filter(p => p.task === 'video').length,
            worksheet: data.filter(p => p.task === 'worksheet').length,
            assignment: data.filter(p => p.task === 'assignment').length,
            final: data.filter(p => p.task === 'final').length
          }
        };

        // عرض الإحصائيات
        statsContainer.innerHTML = `
          <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
            <p class="text-3xl font-bold text-blue-700">${stats.total}</p>
            <p class="text-sm text-blue-600">إجمالي السجلات</p>
          </div>
          <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-center">
            <p class="text-3xl font-bold text-green-700">${stats.students}</p>
            <p class="text-sm text-green-600">عدد الطلاب</p>
          </div>
          <div class="bg-purple-50 border border-purple-200 rounded-lg p-4 text-center">
            <p class="text-3xl font-bold text-purple-700">${stats.lessons}</p>
            <p class="text-sm text-purple-600">عدد الدروس</p>
          </div>
          <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-center">
            <p class="text-3xl font-bold text-yellow-700">${stats.tasks.lesson + stats.tasks.video}</p>
            <p class="text-sm text-yellow-600">المهام المكتملة</p>
          </div>
        `;

        // عرض السجلات مجمعة حسب الطالب
        const groupedByStudent = {};
        data.forEach(record => {
          const mobile = record.student_mobile;
          if (!groupedByStudent[mobile]) {
            groupedByStudent[mobile] = [];
          }
          groupedByStudent[mobile].push(record);
        });

        let html = '';
        Object.keys(groupedByStudent).forEach(mobile => {
          const records = groupedByStudent[mobile];
          const studentName = records[0].student_mobile; // يمكن تحسينه بجلب اسم الطالب

          html += `
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
              <h3 class="text-lg font-bold text-gray-800 mb-3">👤 ${mobile}</h3>
              <div class="space-y-2">
          `;

          records.forEach(record => {
            const taskIcons = {
              lesson: '📑',
              video: '▶️',
              worksheet: '📝',
              assignment: '📂',
              final: '🧾'
            };
            const icon = taskIcons[record.task] || '📌';
            const date = new Date(record.timestamp).toLocaleString('ar-EG');

            html += `
              <div class="bg-white border border-gray-200 rounded p-3 text-sm">
                <div class="flex justify-between items-start">
                  <div class="flex-1">
                    <p class="font-semibold text-gray-800">${icon} ${record.lesson_title || 'درس #' + record.lesson_id}</p>
                    <p class="text-gray-600">المهمة: ${record.task}</p>
                    <p class="text-gray-500 text-xs">${date}</p>
                  </div>
                  <span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">${record.status || 'completed'}</span>
                </div>
                ${record.payload && Object.keys(record.payload).length > 0 ? `
                  <details class="mt-2">
                    <summary class="cursor-pointer text-xs text-gray-500 hover:text-gray-700">عرض التفاصيل</summary>
                    <pre class="mt-1 text-xs bg-gray-100 p-2 rounded overflow-auto">${JSON.stringify(record.payload, null, 2)}</pre>
                  </details>
                ` : ''}
              </div>
            `;
          });

          html += `
              </div>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<p class="text-center text-red-500">❌ خطأ: ${err.message}</p>`;
        console.error(err);
      }
    }

    // حذف جميع السجلات
    async function clearAllProgress() {
      if (!confirm('⚠️ هل أنت متأكد من حذف جميع سجلات التقدم؟')) {
        return;
      }

      try {
        const { error } = await supabase
          .from('progress')
          .delete()
          .neq('id', ''); // حذف جميع السجلات

        if (error) {
          alert('❌ خطأ: ' + error.message);
        } else {
          alert('✅ تم حذف جميع السجلات');
          loadProgress();
        }
      } catch (err) {
        alert('❌ خطأ: ' + err.message);
      }
    }

    // تحميل البيانات عند بدء الصفحة
    window.addEventListener('load', loadProgress);
  </script>
</body>
</html>
