<!-- صفحة اعتماد المشاريع للمعلم -->
<!-- ============================================================ -->
<!-- 
  هذا الكود يُضاف إلى teacher-main.html بعد #dashboard-screen
  ويُضاف <script src="teacher-projects-approval.js"></script> في النهاية
-->

<!-- Projects Approval Screen -->
<div id="projects-approval-screen" class="hidden min-h-screen bg-gradient-to-br from-cyan-50 via-sky-50 to-blue-50 py-8">
  <div class="container mx-auto px-4">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">📋 اعتماد درجات المشاريع</h1>
          <p class="text-gray-600">راجع المشاريع المرفوعة واعتمد الدرجات</p>
        </div>
        <button onclick="backToDashboardFromProjects()" 
                class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-xl font-bold transition">
          ← العودة
        </button>
      </div>
    </div>

    <!-- Projects List -->
    <div id="projects-approval-list">
      <!-- سيتم ملؤها ديناميكياً -->
    </div>
  </div>
</div>

<!-- Approval Modal -->
<div id="approval-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <div class="p-6">
      <!-- Modal Header -->
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-gray-900">✅ اعتماد درجة المشروع</h2>
        <button onclick="closeApprovalModal()" 
                class="text-gray-500 hover:text-gray-700 text-2xl font-bold">
          ×
        </button>
      </div>

      <!-- Project Info -->
      <form id="approval-form" class="space-y-6">
        <div class="bg-gradient-to-r from-cyan-50 to-sky-50 border-2 border-cyan-200 rounded-xl p-4">
          <p class="text-sm text-gray-600 mb-1">👤 الطالب:</p>
          <p id="approval-student-name" class="text-lg font-bold text-gray-900 mb-3"></p>
          
          <p class="text-sm text-gray-600 mb-1">🎯 المشروع:</p>
          <p id="approval-lesson-title" class="text-lg font-bold text-gray-900"></p>
        </div>

        <!-- Action Selection -->
        <div class="space-y-3">
          <label class="block text-sm font-bold text-gray-700 mb-2">الإجراء:</label>
          
          <label class="flex items-center gap-3 p-4 border-2 border-green-300 bg-green-50 rounded-xl cursor-pointer hover:bg-green-100 transition">
            <input type="radio" name="approval-action" value="approve" checked 
                   class="w-5 h-5 text-green-600">
            <div>
              <p class="font-bold text-green-900">✅ اعتماد المشروع</p>
              <p class="text-xs text-green-700">قبول المشروع واعتماد الدرجة</p>
            </div>
          </label>

          <label class="flex items-center gap-3 p-4 border-2 border-red-300 bg-red-50 rounded-xl cursor-pointer hover:bg-red-100 transition">
            <input type="radio" name="approval-action" value="reject" 
                   class="w-5 h-5 text-red-600">
            <div>
              <p class="font-bold text-red-900">❌ رفض المشروع</p>
              <p class="text-xs text-red-700">رفض المشروع بدون اعتماد درجة</p>
            </div>
          </label>
        </div>

        <!-- Grade Input -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">🎯 الدرجة (من 5):</label>
          <input type="number" 
                 id="approval-grade" 
                 min="0" 
                 max="5" 
                 step="0.5"
                 class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 text-lg font-bold"
                 placeholder="أدخل الدرجة (مثال: 4.5)">
          <p class="text-xs text-gray-500 mt-1">* يمكنك إدخال أرقام عشرية (مثال: 3.5، 4.5)</p>
        </div>

        <!-- Teacher Notes -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">💬 ملاحظات المعلم (اختياري):</label>
          <textarea id="approval-notes" 
                    rows="4" 
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 resize-none"
                    placeholder="أضف ملاحظاتك هنا..."></textarea>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 pt-4">
          <button type="button" 
                  onclick="closeApprovalModal()" 
                  class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-3 rounded-xl font-bold transition">
            إلغاء
          </button>
          <button type="button" 
                  id="save-approval-btn"
                  onclick="saveProjectApproval()" 
                  class="flex-1 bg-gradient-to-r from-cyan-600 to-sky-600 hover:from-cyan-700 hover:to-sky-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition">
            💾 حفظ
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
