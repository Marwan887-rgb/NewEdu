    function showLog(message, type = 'info') {
      const resultsDiv = document.getElementById('results');
      const colors = { info: 'blue', success: 'green', error: 'red', warning: 'yellow' };
      const color = colors[type] || 'gray';
      const div = document.createElement('div');
      div.className = `p-3 rounded-lg bg-${color}-50 border border-${color}-200`;
      div.innerHTML = `<p class="text-${color}-800 text-sm">${message}</p>`;
      resultsDiv.appendChild(div);
      resultsDiv.scrollTop = resultsDiv.scrollHeight;
    }

    function updateStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      const colors = { info: 'blue', success: 'green', error: 'red' };
      const color = colors[type] || 'blue';
      statusDiv.innerHTML = `<p class="text-${color}-800 font-semibold">${message}</p>`;
    }

    async function seedFullCurriculum() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      
      updateStatus('⏳ جارٍ إضافة الخطة الكاملة...', 'info');
      showLog(`بدء إضافة ${fullCurriculum.length} عنصر إلى قاعدة البيانات...`, 'info');

      try {
        const { data, error } = await supabase
          .from('lessons')
          .upsert(fullCurriculum, { onConflict: 'id' });

        if (error) {
          showLog(`خطأ: ${error.message}`, 'error');
          updateStatus('❌ فشل إضافة البيانات', 'error');
          return;
        }

        showLog(`✅ تم إضافة ${fullCurriculum.length} عنصر بنجاح!`, 'success');

        // التحقق وعرض الإحصائيات
        const { data: checkData, error: checkError } = await supabase
          .from('lessons')
          .select('*');

        if (checkError) {
          showLog(`خطأ في التحقق: ${checkError.message}`, 'error');
        } else {
          showLog(`✅ تم التحقق: يوجد ${checkData.length} عنصر في قاعدة البيانات`, 'success');
          
          // إحصائيات حسب النوع
          const stats = {
            lesson: checkData.filter(item => item.type === 'lesson').length,
            review: checkData.filter(item => item.type === 'review').length,
            project: checkData.filter(item => item.type === 'project').length,
            exam: checkData.filter(item => item.type === 'exam').length,
            activity: checkData.filter(item => item.type === 'activity').length
          };
          
          showLog('📊 الإحصائيات:', 'info');
          showLog(`  📚 دروس: ${stats.lesson}`, 'info');
          showLog(`  📝 مراجعات: ${stats.review}`, 'info');
          showLog(`  🎯 مشاريع: ${stats.project}`, 'info');
          showLog(`  📋 اختبارات: ${stats.exam}`, 'info');
          showLog(`  🎨 أنشطة: ${stats.activity}`, 'info');
        }

        updateStatus('✅ تم إضافة الخطة الكاملة بنجاح!', 'success');

      } catch (error) {
        showLog(`خطأ عام: ${error.message}`, 'error');
        updateStatus('❌ حدث خطأ', 'error');
      }
    }

    async function clearData() {
      if (!confirm('⚠️ هل أنت متأكد من حذف جميع البيانات؟')) return;

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      updateStatus('⏳ جارٍ حذف البيانات...', 'info');

      try {
        const { error } = await supabase
          .from('lessons')
          .delete()
          .neq('id', 0);

        if (error) {
          showLog(`خطأ: ${error.message}`, 'error');
        } else {
          showLog('✅ تم حذف جميع البيانات', 'success');
        }

        updateStatus('✅ تم حذف البيانات', 'success');
      } catch (error) {
        showLog(`خطأ: ${error.message}`, 'error');
        updateStatus('❌ حدث خطأ', 'error');
      }
    }
