<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كشف المهام الأدائية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-blue-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-3xl">📊</span>
          <div>
            <h1 class="text-2xl font-bold text-indigo-700">كشف المهام الأدائية</h1>
            <p class="text-sm text-gray-600">متابعة إنجاز الطلاب للمهام</p>
          </div>
        </div>
        <button onclick="location.href='teacher-dashboard.html'" 
                class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-semibold transition">
          ← العودة للوحة التحكم
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Filters Section -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <span>🔍</span>
        <span>اختر الفصل والدرس</span>
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Class Selection -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">الفصل</label>
          <select id="classSelect" 
                  onchange="loadReport()"
                  class="w-full border-2 border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500">
            <option value="">اختر الفصل...</option>
          </select>
        </div>

        <!-- Lesson Selection -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">الدرس</label>
          <select id="lessonSelect" 
                  onchange="loadReport()"
                  class="w-full border-2 border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500">
            <option value="">اختر الدرس...</option>
          </select>
        </div>

        <!-- Refresh Button -->
        <div class="flex items-end">
          <button onclick="loadReport()" 
                  class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-bold transition">
            🔄 تحديث الكشف
          </button>
        </div>
      </div>
    </div>

    <!-- Statistics Cards -->
    <div id="statisticsSection" class="hidden mb-6">
      <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="bg-white rounded-xl shadow-md p-4 text-center">
          <div class="text-3xl mb-2">👁️</div>
          <p class="text-sm text-gray-600">عرض الدرس</p>
          <p id="stat-lesson" class="text-2xl font-bold text-indigo-600">0/0</p>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 text-center">
          <div class="text-3xl mb-2">🎬</div>
          <p class="text-sm text-gray-600">الفيديو</p>
          <p id="stat-video" class="text-2xl font-bold text-purple-600">0/0</p>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 text-center">
          <div class="text-3xl mb-2">📝</div>
          <p class="text-sm text-gray-600">ورقة العمل</p>
          <p id="stat-worksheet" class="text-2xl font-bold text-green-600">0/0</p>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 text-center">
          <div class="text-3xl mb-2">📤</div>
          <p class="text-sm text-gray-600">الواجب</p>
          <p id="stat-assignment" class="text-2xl font-bold text-orange-600">0/0</p>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 text-center">
          <div class="text-3xl mb-2">🎯</div>
          <p class="text-sm text-gray-600">التقويم النهائي</p>
          <p id="stat-final" class="text-2xl font-bold text-red-600">0/0</p>
        </div>
      </div>
    </div>

    <!-- Report Table -->
    <div id="reportSection" class="bg-white rounded-xl shadow-md p-6">
      <div id="reportContent" class="text-center py-16 text-gray-500">
        <div class="text-6xl mb-4">📊</div>
        <p class="text-lg font-semibold">اختر الفصل والدرس لعرض الكشف</p>
      </div>
    </div>

    <!-- Export Buttons -->
    <div id="exportSection" class="hidden mt-6 flex gap-4 justify-end">
      <button onclick="printReport()" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold transition">
        🖨️ طباعة الكشف
      </button>
      <button onclick="exportToCSV()" 
              class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold transition">
        📥 تصدير Excel
      </button>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentData = null;

    // المهام الأدائية الخمس
    const TASKS = [
      { id: 'lesson', name: 'عرض الدرس', icon: '👁️', color: 'indigo' },
      { id: 'video', name: 'مشاهدة الفيديو', icon: '🎬', color: 'purple' },
      { id: 'worksheet', name: 'ورقة العمل', icon: '📝', color: 'green' },
      { id: 'assignment', name: 'الواجب', icon: '📤', color: 'orange' },
      { id: 'final', name: 'التقويم النهائي', icon: '🎯', color: 'red' }
    ];

    // تحميل الفصول والدروس
    async function loadFilters() {
      try {
        // تحميل الفصول
        const { data: students } = await supabase
          .from('students')
          .select('class')
          .order('class');

        const classes = [...new Set(students.map(s => s.class))].filter(c => c);
        const classSelect = document.getElementById('classSelect');
        classSelect.innerHTML = '<option value="">اختر الفصل...</option>' +
          classes.map(c => `<option value="${c}">${c}</option>`).join('');

        // تحميل الدروس
        const { data: lessons } = await supabase
          .from('lessons')
          .select('id, title')
          .order('id');

        const lessonSelect = document.getElementById('lessonSelect');
        lessonSelect.innerHTML = '<option value="">اختر الدرس...</option>' +
          lessons.map(l => `<option value="${l.id}">الدرس ${l.id}: ${l.title}</option>`).join('');

      } catch (error) {
        console.error('Error loading filters:', error);
      }
    }

    // تحميل الكشف
    async function loadReport() {
      const className = document.getElementById('classSelect').value;
      const lessonId = document.getElementById('lessonSelect').value;

      if (!className || !lessonId) {
        document.getElementById('reportContent').innerHTML = `
          <div class="text-center py-16 text-gray-500">
            <div class="text-6xl mb-4">📊</div>
            <p class="text-lg font-semibold">اختر الفصل والدرس لعرض الكشف</p>
          </div>`;
        document.getElementById('statisticsSection').classList.add('hidden');
        document.getElementById('exportSection').classList.add('hidden');
        return;
      }

      document.getElementById('reportContent').innerHTML = `
        <div class="text-center py-16">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
          <p class="mt-4 text-gray-600">جارٍ تحميل الكشف...</p>
        </div>`;

      try {
        // جلب طلاب الفصل
        const { data: students, error: studentsError } = await supabase
          .from('students')
          .select('*')
          .eq('class', className)
          .order('name');

        if (studentsError) throw studentsError;

        if (!students || students.length === 0) {
          document.getElementById('reportContent').innerHTML = `
            <div class="text-center py-16 text-gray-500">
              <div class="text-6xl mb-4">👥</div>
              <p class="text-lg font-semibold">لا يوجد طلاب في هذا الفصل</p>
            </div>`;
          return;
        }

        // جلب تقدم الطلاب للدرس المحدد
        const { data: progress, error: progressError } = await supabase
          .from('progress')
          .select('*')
          .eq('lesson_id', parseInt(lessonId));

        if (progressError) throw progressError;

        // بناء خريطة التقدم
        const progressMap = {};
        (progress || []).forEach(p => {
          if (!progressMap[p.student_mobile]) {
            progressMap[p.student_mobile] = {};
          }
          progressMap[p.student_mobile][p.task] = true;
        });

        // حساب الإحصائيات
        const stats = {
          lesson: 0, video: 0, worksheet: 0, assignment: 0, final: 0
        };
        
        students.forEach(student => {
          const studentProgress = progressMap[student.mobile] || {};
          TASKS.forEach(task => {
            if (studentProgress[task.id]) stats[task.id]++;
          });
        });

        // عرض الإحصائيات
        TASKS.forEach(task => {
          document.getElementById(`stat-${task.id}`).textContent = 
            `${stats[task.id]}/${students.length}`;
        });
        document.getElementById('statisticsSection').classList.remove('hidden');
        document.getElementById('exportSection').classList.remove('hidden');

        // عرض الجدول
        displayReport(students, progressMap, className, lessonId);
        currentData = { students, progressMap, className, lessonId };

      } catch (error) {
        console.error('Error loading report:', error);
        document.getElementById('reportContent').innerHTML = `
          <div class="text-center py-16 text-red-500">
            <div class="text-6xl mb-4">❌</div>
            <p class="text-lg font-semibold">خطأ في تحميل الكشف</p>
            <p class="text-sm mt-2">${error.message}</p>
          </div>`;
      }
    }

    function displayReport(students, progressMap, className, lessonId) {
      const lessonTitle = document.getElementById('lessonSelect').selectedOptions[0].text;
      
      const html = `
        <div class="mb-6">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="text-2xl font-bold text-gray-800">كشف المهام الأدائية</h3>
              <p class="text-gray-600 mt-1">
                <span class="font-semibold">الفصل:</span> ${className} | 
                <span class="font-semibold">${lessonTitle}</span>
              </p>
            </div>
            <div class="text-right">
              <p class="text-sm text-gray-600">عدد الطلاب</p>
              <p class="text-3xl font-bold text-indigo-600">${students.length}</p>
            </div>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full border-collapse">
            <thead>
              <tr class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                <th class="border border-gray-300 px-4 py-3 text-right font-bold">م</th>
                <th class="border border-gray-300 px-4 py-3 text-right font-bold">اسم الطالب</th>
                <th class="border border-gray-300 px-4 py-3 text-center font-bold">رقم الجوال</th>
                ${TASKS.map(task => `
                  <th class="border border-gray-300 px-3 py-3 text-center font-bold">
                    <div class="flex flex-col items-center gap-1">
                      <span class="text-2xl">${task.icon}</span>
                      <span class="text-xs">${task.name}</span>
                    </div>
                  </th>
                `).join('')}
                <th class="border border-gray-300 px-4 py-3 text-center font-bold">المجموع</th>
              </tr>
            </thead>
            <tbody>
              ${students.map((student, index) => {
                const studentProgress = progressMap[student.mobile] || {};
                const completedTasks = TASKS.filter(task => studentProgress[task.id]).length;
                const completionPercent = Math.round((completedTasks / TASKS.length) * 100);
                
                return `
                  <tr class="hover:bg-gray-50 transition ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}">
                    <td class="border border-gray-300 px-4 py-3 text-center font-semibold text-gray-700">
                      ${index + 1}
                    </td>
                    <td class="border border-gray-300 px-4 py-3 font-semibold text-gray-800">
                      ${student.name}
                    </td>
                    <td class="border border-gray-300 px-4 py-3 text-center text-gray-600 font-mono text-sm">
                      ${student.mobile.slice(-4)}...
                    </td>
                    ${TASKS.map(task => {
                      const completed = studentProgress[task.id];
                      return `
                        <td class="border border-gray-300 px-3 py-3 text-center">
                          <span class="text-3xl ${completed ? 'text-green-600' : 'text-red-400'}">
                            ${completed ? '✅' : '❌'}
                          </span>
                        </td>
                      `;
                    }).join('')}
                    <td class="border border-gray-300 px-4 py-3 text-center">
                      <div class="flex flex-col items-center">
                        <span class="text-xl font-bold ${completionPercent >= 80 ? 'text-green-600' : completionPercent >= 50 ? 'text-orange-600' : 'text-red-600'}">
                          ${completedTasks}/${TASKS.length}
                        </span>
                        <span class="text-xs text-gray-600">${completionPercent}%</span>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
            <tfoot>
              <tr class="bg-gray-100 font-bold">
                <td colspan="3" class="border border-gray-300 px-4 py-3 text-right">
                  الإجمالي
                </td>
                ${TASKS.map(task => {
                  const completed = students.filter(s => progressMap[s.mobile]?.[task.id]).length;
                  const percent = Math.round((completed / students.length) * 100);
                  return `
                    <td class="border border-gray-300 px-3 py-3 text-center">
                      <div class="flex flex-col items-center">
                        <span class="text-lg">${completed}/${students.length}</span>
                        <span class="text-xs text-gray-600">${percent}%</span>
                      </div>
                    </td>
                  `;
                }).join('')}
                <td class="border border-gray-300 px-4 py-3 text-center text-indigo-600 text-xl">
                  ${Math.round((students.reduce((sum, s) => sum + TASKS.filter(t => progressMap[s.mobile]?.[t.id]).length, 0) / (students.length * TASKS.length)) * 100)}%
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      document.getElementById('reportContent').innerHTML = html;
    }

    function printReport() {
      window.print();
    }

    function exportToCSV() {
      if (!currentData) return;

      const { students, progressMap, className, lessonId } = currentData;
      const lessonTitle = document.getElementById('lessonSelect').selectedOptions[0].text;

      let csv = 'الفصل,' + className + '\n';
      csv += 'الدرس,' + lessonTitle + '\n\n';
      csv += 'م,الاسم,الجوال,' + TASKS.map(t => t.name).join(',') + ',المجموع\n';

      students.forEach((student, index) => {
        const studentProgress = progressMap[student.mobile] || {};
        const row = [
          index + 1,
          student.name,
          student.mobile,
          ...TASKS.map(task => studentProgress[task.id] ? '✓' : '✗'),
          TASKS.filter(task => studentProgress[task.id]).length + '/' + TASKS.length
        ];
        csv += row.join(',') + '\n';
      });

      // تنزيل الملف
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `كشف_المهام_${className}_الدرس${lessonId}.csv`;
      link.click();
    }

    // تحميل الفلاتر عند بدء الصفحة
    window.addEventListener('load', loadFilters);
  </script>

  <style>
    @media print {
      header, #exportSection, #statisticsSection { display: none !important; }
      body { background: white !important; }
    }
  </style>
</body>
</html>
