<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصنيف أسئلة النشاط - DeepSeek AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 to-indigo-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
      <h1 class="text-4xl font-bold text-indigo-700 mb-2 flex items-center gap-3">
        <span>🤖</span>
        <span>تصنيف أسئلة "اختبر نفسك"</span>
      </h1>
      <p class="text-gray-600 text-lg">DeepSeek AI سيفصل الأسئلة حسب كل وحدة</p>
    </div>

    <!-- API Key Section -->
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <span>🔑</span>
        <span>مفتاح DeepSeek API</span>
      </h2>
      <div class="flex gap-3">
        <input 
          type="password" 
          id="api-key" 
          placeholder="أدخل مفتاح API هنا..."
          class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500"
        >
        <button 
          onclick="saveApiKey()"
          class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold transition">
          💾 حفظ
        </button>
      </div>
      <p class="text-sm text-gray-500 mt-2">
        احصل على المفتاح من: 
        <a href="https://platform.deepseek.com" target="_blank" class="text-indigo-600 hover:underline">
          platform.deepseek.com
        </a>
      </p>
    </div>

    <!-- Questions Input -->
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <span>📝</span>
        <span>الصق جميع أسئلة "اختبر نفسك" هنا</span>
      </h2>
      <textarea 
        id="questions-input"
        rows="15"
        placeholder="الصق جميع الأسئلة هنا... DeepSeek سيفصلها تلقائياً"
        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 font-mono text-sm"
      ></textarea>
      
      <button 
        onclick="classifyQuestions()"
        class="mt-4 w-full px-6 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white rounded-lg font-bold text-lg transition shadow-lg">
        🤖 تصنيف الأسئلة بواسطة DeepSeek AI
      </button>
    </div>

    <!-- Status -->
    <div id="status" class="hidden bg-white rounded-2xl shadow-xl p-6 mb-6">
      <div class="flex items-center gap-3">
        <div class="loader"></div>
        <p class="text-gray-700 font-semibold">جاري التصنيف...</p>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    <!-- Save Button -->
    <div id="save-section" class="hidden mt-6">
      <button 
        onclick="saveToDatabase()"
        class="w-full px-6 py-4 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold text-lg transition shadow-lg">
        💾 حفظ التصنيف في قاعدة البيانات
      </button>
    </div>
  </div>

  <style>
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #6366f1;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';
    let classifiedQuestions = null;

    // Load saved API key
    if (deepseekApiKey) {
      document.getElementById('api-key').value = deepseekApiKey;
    }

    function saveApiKey() {
      const key = document.getElementById('api-key').value.trim();
      if (!key) {
        alert('❌ الرجاء إدخال مفتاح API');
        return;
      }
      localStorage.setItem('deepseek_api_key', key);
      deepseekApiKey = key;
      alert('✅ تم حفظ المفتاح بنجاح!');
    }

    async function classifyQuestions() {
      const questionsText = document.getElementById('questions-input').value.trim();
      
      if (!deepseekApiKey) {
        alert('❌ الرجاء إدخال وحفظ مفتاح DeepSeek API أولاً');
        return;
      }

      if (!questionsText) {
        alert('❌ الرجاء لصق الأسئلة أولاً');
        return;
      }

      document.getElementById('status').classList.remove('hidden');
      document.getElementById('results').innerHTML = '';
      document.getElementById('save-section').classList.add('hidden');

      try {
        const prompt = `أنت خبير في تصنيف الأسئلة التعليمية. لديك أسئلة من مقرر "الحاسب وتقنية المعلومات 3" وتحتاج لتصنيفها إلى 3 وحدات:

**الوحدة الأولى: تخطيط المشروعات**
- المواضيع: أساسيات تخطيط المشروع، بناء وأتمتة خطة المشروع، إدارة المهام

**الوحدة الثانية: دورة حياة النظام**
- المواضيع: دورة حياة النظام، إنشاء المخططات الانسيابية، الأمن السيبراني

**الوحدة الثالثة: تطبيقات الهواتف الذكية**
- المواضيع: مقدمة عن تطبيقات الهواتف، بناء التطبيقات، برمجة التطبيق

الأسئلة:
${questionsText}

الرجاء تصنيف هذه الأسئلة إلى الوحدات الثلاث. أعد الإجابة بصيغة JSON فقط على الشكل التالي:
{
  "unit1": ["السؤال 1", "السؤال 2", ...],
  "unit2": ["السؤال 1", "السؤال 2", ...],
  "unit3": ["السؤال 1", "السؤال 2", ...]
}`;

        const response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${deepseekApiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.3
          })
        });

        if (!response.ok) {
          throw new Error('فشل الاتصال بـ DeepSeek API');
        }

        const data = await response.json();
        const content = data.choices[0].message.content;
        
        // Extract JSON from response
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        if (!jsonMatch) {
          throw new Error('لم يتم الحصول على نتيجة صحيحة من DeepSeek');
        }

        classifiedQuestions = JSON.parse(jsonMatch[0]);
        displayResults(classifiedQuestions);
        
        document.getElementById('status').classList.add('hidden');
        document.getElementById('save-section').classList.remove('hidden');

      } catch (error) {
        console.error('Error:', error);
        alert('❌ خطأ في التصنيف: ' + error.message);
        document.getElementById('status').classList.add('hidden');
      }
    }

    function displayResults(classified) {
      const resultsDiv = document.getElementById('results');
      
      const units = [
        { key: 'unit1', title: 'الوحدة الأولى: تخطيط المشروعات', color: 'blue', emoji: '📊' },
        { key: 'unit2', title: 'الوحدة الثانية: دورة حياة النظام', color: 'purple', emoji: '🔄' },
        { key: 'unit3', title: 'الوحدة الثالثة: تطبيقات الهواتف', color: 'green', emoji: '📱' }
      ];

      units.forEach(unit => {
        const questions = classified[unit.key] || [];
        const html = `
          <div class="bg-white rounded-2xl shadow-xl p-6 border-t-4 border-${unit.color}-500">
            <h3 class="text-xl font-bold text-${unit.color}-700 mb-4 flex items-center gap-2">
              <span>${unit.emoji}</span>
              <span>${unit.title}</span>
            </h3>
            <div class="bg-${unit.color}-50 rounded-lg p-4 mb-3">
              <p class="text-${unit.color}-900 font-bold text-lg">${questions.length} سؤال</p>
            </div>
            <div class="space-y-2 max-h-96 overflow-y-auto">
              ${questions.map((q, i) => `
                <div class="bg-gray-50 rounded-lg p-3 border border-gray-200">
                  <p class="text-sm text-gray-700"><strong>${i+1}.</strong> ${q}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        resultsDiv.insertAdjacentHTML('beforeend', html);
      });
    }

    async function saveToDatabase() {
      if (!classifiedQuestions) {
        alert('❌ لا توجد بيانات لحفظها');
        return;
      }

      if (!confirm('هل تريد حفظ التصنيف في قاعدة البيانات؟')) {
        return;
      }

      try {
        // Here you would save to your activities table
        // For now, just download as JSON
        const dataStr = JSON.stringify(classifiedQuestions, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'classified-activities.json';
        link.click();
        
        alert('✅ تم تنزيل النتائج! استخدمها لإنشاء الأنشطة في قاعدة البيانات');
        
      } catch (error) {
        console.error('Error:', error);
        alert('❌ خطأ في الحفظ: ' + error.message);
      }
    }
  </script>
</body>
</html>
