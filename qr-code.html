<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code - EduActive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 to-indigo-100 min-h-screen p-6 flex items-center justify-center">
  <div class="max-w-2xl mx-auto">
    
    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 text-center">
      
      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-5xl font-bold text-purple-700 mb-3">📱 QR Code</h1>
        <p class="text-2xl text-gray-700 font-bold">منصة EduActive</p>
        <p class="text-gray-600 mt-2">التقنية الرقمية 3</p>
      </div>

      <!-- QR Code -->
      <div class="bg-gradient-to-br from-purple-100 to-indigo-100 rounded-2xl p-8 mb-6">
        <div id="qrcode" class="flex justify-center"></div>
      </div>

      <!-- الرابط -->
      <div class="bg-gray-50 rounded-xl p-4 mb-6">
        <p class="text-gray-500 text-sm mb-2">الرابط:</p>
        <p class="text-purple-700 font-bold break-all" id="linkText">
          https://chipper-otter-505a1a.netlify.app
        </p>
      </div>

      <!-- التعليمات -->
      <div class="bg-blue-50 border-2 border-blue-200 rounded-xl p-6 mb-6 text-right">
        <h3 class="text-xl font-bold text-blue-700 mb-3">📝 تعليمات الاستخدام:</h3>
        <ol class="space-y-2 text-gray-700">
          <li class="flex items-start gap-2">
            <span class="font-bold text-blue-600">1.</span>
            <span>افتح كاميرا الجوال</span>
          </li>
          <li class="flex items-start gap-2">
            <span class="font-bold text-blue-600">2.</span>
            <span>وجّه الكاميرا على الباركود</span>
          </li>
          <li class="flex items-start gap-2">
            <span class="font-bold text-blue-600">3.</span>
            <span>اضغط على الإشعار الظاهر</span>
          </li>
          <li class="flex items-start gap-2">
            <span class="font-bold text-blue-600">4.</span>
            <span>سجّل دخولك برقم الجوال</span>
          </li>
        </ol>
      </div>

      <!-- أزرار -->
      <div class="flex flex-col gap-3">
        <button onclick="downloadQR()" 
          class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-8 rounded-xl transition text-lg">
          📥 تحميل الباركود
        </button>
        
        <button onclick="printQR()" 
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl transition text-lg">
          🖨️ طباعة الباركود
        </button>

        <button onclick="window.location.href='teacher.html'" 
          class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-xl transition">
          ← العودة للوحة المعلم
        </button>
      </div>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t-2 border-gray-200">
        <p class="text-gray-500 text-sm">
          معلم المادة: مروان رده الشريفي<br>
          مدرسة التأهيل الثانوية
        </p>
      </div>

    </div>
  </div>

  <script>
    // الرابط
    const siteUrl = 'https://chipper-otter-505a1a.netlify.app';

    // إنشاء QR Code
    const qrcode = new QRCode(document.getElementById('qrcode'), {
      text: siteUrl,
      width: 300,
      height: 300,
      colorDark: '#7c3aed',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    // تحميل الباركود
    function downloadQR() {
      const canvas = document.querySelector('#qrcode canvas');
      const link = document.createElement('a');
      link.download = 'EduActive-QRCode.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    // طباعة الباركود
    function printQR() {
      window.print();
    }
  </script>

  <style>
    @media print {
      body {
        background: white;
      }
      button {
        display: none;
      }
    }
  </style>
</body>
</html>
