<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توليد أوراق العمل - Gemini AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-50 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
      <h1 class="text-3xl font-bold text-indigo-700 mb-2 flex items-center gap-3">
        <span>🤖</span>
        <span>توليد أوراق العمل بالذكاء الاصطناعي</span>
      </h1>
      <p class="text-gray-600">استخدم Gemini AI لتوليد أسئلة ذكية تلقائياً</p>
    </div>

    <!-- API Key Section -->
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">⚙️ إعدادات API</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Gemini API Key</label>
          <input type="password" id="gemini-api-key" 
                 class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none"
                 placeholder="أدخل مفتاح Gemini API">
        </div>
        <button onclick="saveApiKey()" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold transition">
          💾 حفظ المفتاح
        </button>
      </div>
    </div>

    <!-- Lessons List -->
    <div class="bg-white rounded-2xl shadow-xl p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">📚 الدروس</h2>
      <div id="lessons-container" class="space-y-3"></div>
    </div>

    <!-- Status -->
    <div id="status" class="mt-6 p-4 rounded-lg hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let geminiApiKey = localStorage.getItem('gemini_api_key') || '';

    function saveApiKey() {
      const key = document.getElementById('gemini-api-key').value.trim();
      if (!key) {
        showStatus('⚠️ الرجاء إدخال مفتاح API', 'error');
        return;
      }
      localStorage.setItem('gemini_api_key', key);
      geminiApiKey = key;
      showStatus('✅ تم حفظ المفتاح بنجاح', 'success');
      document.getElementById('gemini-api-key').value = '';
    }

    async function loadLessons() {
      try {
        const { data, error } = await supabase
          .from('lessons')
          .select('*')
          .eq('type', 'lesson')
          .order('id');

        if (error) throw error;

        const container = document.getElementById('lessons-container');
        container.innerHTML = data.map(lesson => `
          <div class="border-2 border-gray-200 rounded-xl p-4 hover:border-indigo-300 transition">
            <div class="flex items-start justify-between gap-4">
              <div class="flex-1">
                <h3 class="font-bold text-gray-900 mb-1">${lesson.title}</h3>
                <p class="text-sm text-gray-600">${lesson.unit}</p>
                <div class="mt-2 space-y-2">
                  <input type="text" 
                         id="docs-link-${lesson.id}" 
                         placeholder="رابط Google Docs للدرس (اختياري)"
                         value="${lesson.google_docs_link || ''}"
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-indigo-500 focus:outline-none">
                  <textarea 
                         id="content-${lesson.id}" 
                         rows="3"
                         placeholder="أو الصق محتوى الدرس هنا مباشرة..."
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-indigo-500 focus:outline-none resize-none"></textarea>
                </div>
              </div>
              <button onclick="generateWorksheet(${lesson.id})" 
                      class="flex-shrink-0 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-4 py-2 rounded-lg font-semibold transition transform hover:scale-105">
                🤖 توليد
              </button>
            </div>
          </div>
        `).join('');

      } catch (error) {
        showStatus('❌ خطأ في تحميل الدروس: ' + error.message, 'error');
      }
    }

    async function generateWorksheet(lessonId) {
      if (!geminiApiKey) {
        showStatus('⚠️ الرجاء إدخال مفتاح Gemini API أولاً', 'error');
        return;
      }

      const docsLink = document.getElementById(`docs-link-${lessonId}`).value.trim();
      const manualContent = document.getElementById(`content-${lessonId}`).value.trim();

      if (!docsLink && !manualContent) {
        showStatus('⚠️ الرجاء إدخال رابط Google Docs أو لصق المحتوى مباشرة', 'error');
        return;
      }

      showStatus('⏳ جاري توليد الأسئلة باستخدام Gemini AI...', 'info');

      try {
        let content = '';

        // 1. إذا كان هناك محتوى يدوي، استخدمه مباشرة
        if (manualContent) {
          content = manualContent;
          showStatus('⏳ استخدام المحتوى اليدوي...', 'info');
        } 
        // 2. إذا كان هناك رابط، حاول قراءة المحتوى
        else if (docsLink) {
          await supabase.from('lessons').update({ google_docs_link: docsLink }).eq('id', lessonId);
          const docId = extractDocId(docsLink);
          content = await fetchDocContent(docId);
        }

        if (!content || content.trim().length < 50) {
          throw new Error('المحتوى قصير جداً أو فارغ. الرجاء إدخال محتوى كافٍ (50 حرف على الأقل)');
        }

        // 3. استخدام Gemini لتوليد الأسئلة
        const questions = await generateQuestionsWithGemini(content);

        // 4. حفظ الأسئلة في قاعدة البيانات
        const { error } = await supabase
          .from('worksheets')
          .upsert({ 
            lesson_id: lessonId, 
            questions: questions,
            updated_at: new Date().toISOString()
          }, { onConflict: 'lesson_id' });

        if (error) throw error;

        showStatus('✅ تم توليد ورقة العمل بنجاح!', 'success');
        displayQuestions(questions);

      } catch (error) {
        showStatus('❌ خطأ: ' + error.message, 'error');
      }
    }

    function extractDocId(url) {
      const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (!match) throw new Error('رابط Google Docs غير صحيح');
      return match[1];
    }

    async function fetchDocContent(docId) {
      // استخدام Google Docs API v1 مع Gemini API Key كـ fallback
      // الطريقة 1: محاولة قراءة المحتوى عبر API
      try {
        const apiUrl = `https://docs.googleapis.com/v1/documents/${docId}?key=${geminiApiKey}`;
        const response = await fetch(apiUrl);
        
        if (response.ok) {
          const data = await response.json();
          // استخراج النص من البنية
          let text = '';
          if (data.body && data.body.content) {
            data.body.content.forEach(element => {
              if (element.paragraph && element.paragraph.elements) {
                element.paragraph.elements.forEach(el => {
                  if (el.textRun && el.textRun.content) {
                    text += el.textRun.content;
                  }
                });
              }
            });
          }
          if (text.trim()) return text;
        }
      } catch (e) {
        console.log('API method failed, trying alternative...');
      }

      // الطريقة 2: استخدام RSS feed
      try {
        const rssUrl = `https://docs.google.com/feeds/download/documents/export/Export?id=${docId}&exportFormat=txt`;
        const response = await fetch(rssUrl, { mode: 'no-cors' });
        if (response.ok) {
          return await response.text();
        }
      } catch (e) {
        console.log('RSS method failed...');
      }

      // الطريقة 3: طلب من المستخدم نسخ المحتوى
      throw new Error('لا يمكن قراءة المستند تلقائياً. الرجاء نسخ المحتوى يدوياً أدناه.');
    }

    async function generateQuestionsWithGemini(content) {
      const prompt = `بناءً على المحتوى التالي، أنشئ 6 أسئلة تعليمية:
- 3 أسئلة قصيرة (إجابة مباشرة)
- 3 أسئلة تفكير وتحليل (إجابة مفصلة)

المحتوى:
${content}

أعد الأسئلة كقائمة مرقمة من 1 إلى 6 بصيغة JSON فقط بدون أي نص إضافي:
[
  {"number": 1, "question": "السؤال هنا؟", "type": "short"},
  {"number": 2, "question": "السؤال هنا؟", "type": "short"},
  {"number": 3, "question": "السؤال هنا؟", "type": "short"},
  {"number": 4, "question": "السؤال هنا؟", "type": "analysis"},
  {"number": 5, "question": "السؤال هنا؟", "type": "analysis"},
  {"number": 6, "question": "السؤال هنا؟", "type": "analysis"}
]`;

      try {
        // التحقق من API Key
        if (!geminiApiKey || geminiApiKey.length < 30) {
          throw new Error('API Key غير صحيح. الرجاء التحقق من المفتاح');
        }

        // خطوة 1: الحصول على قائمة النماذج المتاحة
        showStatus('⏳ جاري البحث عن النماذج المتاحة...', 'info');
        
        const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${geminiApiKey}`;
        const listResponse = await fetch(listUrl);
        
        if (!listResponse.ok) {
          throw new Error('فشل في الحصول على قائمة النماذج. تحقق من API Key');
        }
        
        const listData = await listResponse.json();
        console.log('Available models:', listData);
        
        // البحث عن نموذج يدعم generateContent
        const availableModel = listData.models?.find(m => 
          m.supportedGenerationMethods?.includes('generateContent') &&
          (m.name.includes('gemini') || m.name.includes('generate'))
        );
        
        if (!availableModel) {
          throw new Error('لم يتم العثور على نموذج متاح. تأكد من تفعيل Gemini API');
        }
        
        const modelName = availableModel.name; // مثل: models/gemini-pro
        console.log('Using model:', modelName);
        
        showStatus(`⏳ استخدام النموذج: ${modelName.split('/')[1]}...`, 'info');
        
        // خطوة 2: استخدام النموذج المتاح
        const url = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${geminiApiKey}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: prompt }]
            }],
            generationConfig: {
              temperature: 0.7,
              topK: 40,
              topP: 0.95,
              maxOutputTokens: 2048,
            }
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error('API Error:', errorText);
          
          let errorMsg = 'فشل الاتصال بـ Gemini API';
          try {
            const errorData = JSON.parse(errorText);
            if (errorData.error) {
              errorMsg = errorData.error.message || errorMsg;
            }
          } catch (e) {}
          
          throw new Error(`${errorMsg}. تحقق من: 1) صحة API Key 2) تفعيل Generative Language API في Google Cloud Console`);
        }

        const data = await response.json();
        console.log('Full Gemini Response:', data);
        
        if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
          throw new Error('استجابة غير متوقعة من Gemini. حاول مرة أخرى.');
        }

        const text = data.candidates[0].content.parts[0].text;
        console.log('Generated Text:', text);
        
        // استخراج JSON من النص
        let jsonText = text;
        
        // إزالة code blocks إذا وجدت
        const codeBlockMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
        if (codeBlockMatch) {
          jsonText = codeBlockMatch[1].trim();
        }
        
        // البحث عن array
        const jsonMatch = jsonText.match(/\[[\s\S]*\]/);
        if (!jsonMatch) {
          throw new Error('لم يتم العثور على JSON في الاستجابة. المحتوى المستلم: ' + text.substring(0, 200));
        }
        
        let questions;
        try {
          questions = JSON.parse(jsonMatch[0]);
        } catch (e) {
          throw new Error('فشل في تحليل JSON. تأكد من صحة التنسيق.');
        }
        
        // التحقق من صحة البيانات
        if (!Array.isArray(questions)) {
          throw new Error('الاستجابة ليست array');
        }
        
        if (questions.length !== 6) {
          throw new Error(`عدد الأسئلة ${questions.length} بدلاً من 6. حاول مرة أخرى.`);
        }
        
        // التحقق من وجود الحقول المطلوبة
        for (const q of questions) {
          if (!q.number || !q.question || !q.type) {
            throw new Error('تنسيق السؤال غير صحيح. يجب أن يحتوي على: number, question, type');
          }
        }
        
        showStatus('✅ تم توليد الأسئلة بنجاح!', 'success');
        return questions;
        
      } catch (error) {
        console.error('Generation Error:', error);
        throw error;
      }
    }

    function displayQuestions(questions) {
      const html = `
        <div class="mt-6 bg-green-50 border-2 border-green-200 rounded-xl p-6">
          <h3 class="text-lg font-bold text-green-900 mb-4">✅ الأسئلة المولدة</h3>
          <div class="space-y-3">
            ${questions.map(q => `
              <div class="bg-white rounded-lg p-4 border border-green-200">
                <span class="font-bold text-indigo-600">${q.number}.</span>
                <span class="text-gray-800">${q.question}</span>
                <span class="text-xs text-gray-500 mr-2">(${q.type === 'short' ? 'قصير' : 'تفكير'})</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('status').insertAdjacentHTML('beforeend', html);
    }

    function showStatus(message, type) {
      const statusDiv = document.getElementById('status');
      const colors = {
        info: 'bg-blue-50 border-blue-200 text-blue-800',
        success: 'bg-green-50 border-green-200 text-green-800',
        error: 'bg-red-50 border-red-200 text-red-800'
      };
      statusDiv.className = `mt-6 p-4 rounded-lg border-2 ${colors[type]}`;
      statusDiv.textContent = message;
      statusDiv.classList.remove('hidden');
    }

    // Load API key if saved
    if (geminiApiKey) {
      document.getElementById('gemini-api-key').placeholder = '✓ المفتاح محفوظ';
    }

    loadLessons();
  </script>
</body>
</html>
