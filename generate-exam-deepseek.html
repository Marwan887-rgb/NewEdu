<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توليد التقويم النهائي - DeepSeek AI</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
      <h1 class="text-3xl font-bold text-purple-700 mb-2 flex items-center gap-3">
        <span>🧾</span>
        <span>توليد التقويم النهائي - DeepSeek AI</span>
      </h1>
      <p class="text-gray-600">4 صح/خطأ + 4 اختيار متعدد + 2 تعريفات (مستوى متوسط)</p>
    </div>

    <!-- API Key Section -->
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">⚙️ إعدادات API</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">DeepSeek API Key</label>
          <input type="password" id="deepseek-api-key" 
                 class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none"
                 placeholder="أدخل مفتاح DeepSeek API">
        </div>
        <button onclick="saveApiKey()" 
                class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg font-semibold transition">
          💾 حفظ المفتاح
        </button>
      </div>
    </div>

    <!-- Stats Section -->
    <div id="stats-section" class="bg-gradient-to-r from-green-50 to-emerald-50 border-2 border-green-300 rounded-2xl p-6 mb-6 hidden">
      <h2 class="text-xl font-bold text-green-900 mb-3">📊 إحصائيات</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white rounded-lg p-4 text-center">
          <p class="text-3xl font-bold text-green-600" id="total-lessons">0</p>
          <p class="text-sm text-gray-600">إجمالي الدروس</p>
        </div>
        <div class="bg-white rounded-lg p-4 text-center">
          <p class="text-3xl font-bold text-blue-600" id="exams-generated">0</p>
          <p class="text-sm text-gray-600">الاختبارات المولدة</p>
        </div>
        <div class="bg-white rounded-lg p-4 text-center">
          <p class="text-3xl font-bold text-orange-600" id="remaining-lessons">0</p>
          <p class="text-sm text-gray-600">الدروس المتبقية</p>
        </div>
      </div>
    </div>

    <!-- Lessons List -->
    <div class="bg-white rounded-2xl shadow-xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-gray-800">📚 الدروس</h2>
        <button onclick="checkExistingExams()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
          🔍 عرض الاختبارات الموجودة
        </button>
      </div>
      <div id="lessons-container" class="space-y-3"></div>
    </div>

    <!-- Status -->
    <div id="status" class="mt-6 p-4 rounded-lg hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // تحميل المفتاح من localStorage أو config.js
    const configKey = typeof DEEPSEEK_CONFIG !== 'undefined' ? DEEPSEEK_CONFIG.API_KEY : '';
    let deepseekApiKey = localStorage.getItem('deepseek_api_key') || 
                         (configKey && configKey !== 'ضع_المفتاح_هنا' && configKey !== 'YOUR_DEEPSEEK_API_KEY_HERE' ? configKey : '');

    function saveApiKey() {
      const key = document.getElementById('deepseek-api-key').value.trim();
      if (!key) {
        showStatus('⚠️ الرجاء إدخال مفتاح API', 'error');
        return;
      }
      localStorage.setItem('deepseek_api_key', key);
      deepseekApiKey = key;
      showStatus('✅ تم حفظ المفتاح بنجاح', 'success');
      document.getElementById('deepseek-api-key').value = '';
    }

    async function loadLessons() {
      try {
        const { data, error } = await supabase
          .from('lessons')
          .select('*')
          .eq('type', 'lesson')
          .order('id');

        if (error) throw error;

        // تحميل الاختبارات الموجودة
        const { data: exams } = await supabase
          .from('final_exams')
          .select('lesson_id');
        
        const existingExamIds = new Set(exams?.map(e => e.lesson_id) || []);
        
        // تحديث الإحصائيات
        document.getElementById('total-lessons').textContent = data.length;
        document.getElementById('exams-generated').textContent = existingExamIds.size;
        document.getElementById('remaining-lessons').textContent = data.length - existingExamIds.size;
        document.getElementById('stats-section').classList.remove('hidden');

        const container = document.getElementById('lessons-container');
        container.innerHTML = data.map(lesson => {
          const hasExam = existingExamIds.has(lesson.id);
          return `
          <div class="border-2 ${hasExam ? 'border-green-300 bg-green-50' : 'border-gray-200'} rounded-xl p-4 hover:border-purple-300 transition">
            <div class="flex items-start justify-between gap-4">
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                  <h3 class="font-bold text-gray-900">${lesson.title}</h3>
                  ${hasExam ? '<span class="text-xs bg-green-600 text-white px-2 py-1 rounded-full">✓ تم التوليد</span>' : ''}
                </div>
                <p class="text-sm text-gray-600">${lesson.unit}</p>
                <div class="mt-2">
                  <textarea 
                         id="content-${lesson.id}" 
                         rows="3"
                         placeholder="الصق محتوى الدرس هنا..."
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-purple-500 focus:outline-none resize-none"></textarea>
                </div>
              </div>
              <button onclick="generateExam(${lesson.id})" 
                      class="flex-shrink-0 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white px-4 py-2 rounded-lg font-semibold transition transform hover:scale-105">
                ${hasExam ? '🔄 إعادة توليد' : '🧾 توليد'}
              </button>
            </div>
          </div>
        `}).join('');

      } catch (error) {
        showStatus('❌ خطأ في تحميل الدروس: ' + error.message, 'error');
      }
    }

    async function generateExam(lessonId) {
      if (!deepseekApiKey) {
        showStatus('⚠️ الرجاء إدخال مفتاح DeepSeek API أولاً', 'error');
        return;
      }

      const content = document.getElementById(`content-${lessonId}`).value.trim();

      if (!content) {
        showStatus('⚠️ الرجاء لصق محتوى الدرس', 'error');
        return;
      }

      if (content.length < 50) {
        showStatus('⚠️ المحتوى قصير جداً (50 حرف على الأقل)', 'error');
        return;
      }

      showStatus('⏳ جاري توليد الاختبار باستخدام DeepSeek AI...', 'info');

      try {
        const questions = await generateQuestionsWithDeepSeek(content);

        // عرض الأسئلة أولاً
        showStatus('✅ تم توليد التقويم النهائي بنجاح!', 'success');
        displayQuestions(questions, lessonId);

      } catch (error) {
        showStatus('❌ خطأ: ' + error.message, 'error');
      }
    }

    async function generateQuestionsWithDeepSeek(content) {
      const prompt = `بناءً على المحتوى التعليمي التالي، أنشئ اختبار نهائي يحتوي على 10 أسئلة بمستوى متوسط:

- 4 أسئلة صح أو خطأ (true_false)
- 4 أسئلة اختيار من متعدد (multiple_choice)
- 2 أسئلة تعريفات (definition)

المحتوى:
${content}

مهم جداً:
- الأسئلة يجب أن تكون بمستوى متوسط (ليست سهلة جداً ولا صعبة جداً)
- أسئلة صح/خطأ: اختبر فهم المفاهيم الأساسية
- أسئلة الاختيار المتعدد: يجب أن تكون الخيارات منطقية ومتقاربة
- أسئلة التعريفات: اطلب تعريف مصطلح أو مفهوم مهم من الدرس

أعد الأسئلة بصيغة JSON فقط بدون أي نص إضافي:
[
  {
    "number": 1,
    "type": "true_false",
    "question": "السؤال هنا",
    "correct_answer": "true"
  },
  {
    "number": 5,
    "type": "multiple_choice",
    "question": "السؤال هنا",
    "options": ["الخيار أ", "الخيار ب", "الخيار ج", "الخيار د"],
    "correct_answer": "الخيار ب"
  },
  {
    "number": 9,
    "type": "definition",
    "question": "عرّف المصطلح التالي: [المصطلح]",
    "correct_answer": "التعريف الصحيح هنا"
  }
]

ملاحظات مهمة:
- رقّم الأسئلة من 1 إلى 10 بالترتيب
- الأسئلة 1-4: صح/خطأ
- الأسئلة 5-8: اختيار متعدد
- الأسئلة 9-10: تعريفات
- correct_answer لأسئلة صح/خطأ: "true" أو "false" فقط
- correct_answer لأسئلة الاختيار: نص الخيار الصحيح بالضبط
- correct_answer لأسئلة التعريفات: التعريف الكامل والصحيح
- جميع الأسئلة باللغة العربية الفصحى`;

      try {
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${deepseekApiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              {
                role: 'system',
                content: 'أنت خبير في إعداد الاختبارات التعليمية. أنشئ 10 أسئلة بمستوى متوسط: 4 صح/خطأ + 4 اختيار متعدد + 2 تعريفات. أجب فقط بصيغة JSON دون أي نص إضافي.'
              },
              {
                role: 'user',
                content: prompt
              }
            ],
            temperature: 0.8,
            max_tokens: 3000
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(`DeepSeek API Error: ${errorData.error?.message || 'خطأ غير معروف'}`);
        }

        const data = await response.json();
        const text = data.choices[0].message.content;
        console.log('DeepSeek Response:', text);
        
        // استخراج JSON
        let jsonText = text.trim();
        const codeBlockMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
        if (codeBlockMatch) {
          jsonText = codeBlockMatch[1].trim();
        }
        
        const jsonMatch = jsonText.match(/\[[\s\S]*\]/);
        if (!jsonMatch) {
          throw new Error('لم يتم العثور على JSON');
        }
        
        const questions = JSON.parse(jsonMatch[0]);
        
        // التحقق
        if (!Array.isArray(questions) || questions.length !== 10) {
          throw new Error(`عدد الأسئلة ${questions.length} بدلاً من 10`);
        }
        
        // التحقق من التوزيع الصحيح
        const trueFalseCount = questions.filter(q => q.type === 'true_false').length;
        const multipleChoiceCount = questions.filter(q => q.type === 'multiple_choice').length;
        const definitionCount = questions.filter(q => q.type === 'definition').length;
        
        if (trueFalseCount !== 4 || multipleChoiceCount !== 4 || definitionCount !== 2) {
          throw new Error(`توزيع خاطئ: ${trueFalseCount} صح/خطأ، ${multipleChoiceCount} اختيار، ${definitionCount} تعريفات. المطلوب: 4+4+2`);
        }
        
        // التحقق من صحة كل سؤال
        for (const q of questions) {
          if (!q.number || !q.question || !q.type || !q.correct_answer) {
            throw new Error('تنسيق السؤال غير صحيح');
          }
          if (q.type === 'multiple_choice' && (!q.options || q.options.length !== 4)) {
            throw new Error('يجب أن يكون لكل سؤال اختيار 4 خيارات');
          }
          if (q.type === 'true_false' && q.correct_answer !== 'true' && q.correct_answer !== 'false') {
            throw new Error('إجابة صح/خطأ يجب أن تكون "true" أو "false"');
          }
          if (q.type === 'definition' && !q.correct_answer.trim()) {
            throw new Error('التعريف لا يمكن أن يكون فارغاً');
          }
        }
        
        return questions;
        
      } catch (error) {
        console.error('Generation Error:', error);
        throw error;
      }
    }

    function displayQuestions(questions, lessonId) {
      const html = `
        <div class="mt-6 bg-green-50 border-2 border-green-200 rounded-xl p-6">
          <h3 class="text-lg font-bold text-green-900 mb-4">✅ الأسئلة المولدة (${questions.length})</h3>
          <div class="space-y-4">
            ${questions.map(q => `
              <div class="bg-white rounded-lg p-4 border border-green-200">
                <div class="flex items-start gap-3">
                  <span class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">${q.number}</span>
                  <div class="flex-1">
                    <p class="font-semibold text-gray-900 mb-2">${q.question}</p>
                    ${q.type === 'true_false' ? `
                      <div class="text-sm">
                        <span class="px-3 py-1 rounded-full ${q.correct_answer === 'true' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                          ✓ ${q.correct_answer === 'true' ? 'صح' : 'خطأ'}
                        </span>
                      </div>
                    ` : q.type === 'multiple_choice' ? `
                      <div class="space-y-1 text-sm">
                        ${q.options.map((opt, i) => `
                          <div class="flex items-center gap-2 ${opt === q.correct_answer ? 'font-bold text-green-700' : 'text-gray-600'}">
                            <span>${['أ', 'ب', 'ج', 'د'][i]}.</span>
                            <span>${opt}</span>
                            ${opt === q.correct_answer ? '<span class="text-green-600">✓</span>' : ''}
                          </div>
                        `).join('')}
                      </div>
                    ` : `
                      <div class="bg-green-50 border border-green-200 rounded-lg p-3 mt-2">
                        <p class="text-xs font-semibold text-green-700 mb-1">✓ التعريف الصحيح:</p>
                        <p class="text-sm text-gray-900">${q.correct_answer}</p>
                      </div>
                    `}
                    <div class="mt-2 text-xs text-gray-500">
                      ${q.type === 'true_false' ? '📋 صح/خطأ' : q.type === 'multiple_choice' ? '🔘 اختيار متعدد' : '📝 تعريف'}
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
          
          <!-- زر الحفظ -->
          <div class="mt-6 flex gap-3">
            <button onclick="saveLessonExam(${lessonId}, ${JSON.stringify(questions).replace(/"/g, '&quot;')})" 
                    class="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white px-8 py-4 rounded-lg font-bold text-lg shadow-lg hover:shadow-xl transition transform hover:scale-105">
              💾 تأكيد وحفظ في قاعدة البيانات
            </button>
          </div>
          
          <p class="text-sm text-gray-600 mt-3 text-center">
            💡 سيتم حفظ الاختبار في جدول <strong class="text-purple-700">final_exams</strong> (التقويم النهائي للدرس)
          </p>
        </div>
      `;
      document.getElementById('status').insertAdjacentHTML('beforeend', html);
    }
    
    async function saveLessonExam(lessonId, questions) {
      const confirmMsg = `هل أنت متأكد من حفظ التقويم النهائي للدرس رقم ${lessonId}؟\n\n` +
                        `الأسئلة: ${questions.length} سؤال\n` +
                        `سيتم الحفظ في جدول final_exams`;
      
      if (!confirm(confirmMsg)) {
        return;
      }
      
      showStatus('⏳ جاري الحفظ في قاعدة البيانات...', 'info');
      
      try {
        const { error } = await supabase
          .from('final_exams')
          .upsert({ 
            lesson_id: lessonId, 
            questions: questions,
            total_marks: 10,
            updated_at: new Date().toISOString()
          }, { onConflict: 'lesson_id' });

        if (error) throw error;

        showStatus('✅ تم حفظ التقويم النهائي في قاعدة البيانات بنجاح!', 'success');
        
        // إعادة تحميل الدروس لتحديث الحالة
        setTimeout(() => loadLessons(), 1000);

      } catch (error) {
        showStatus('❌ خطأ في الحفظ: ' + error.message, 'error');
      }
    }

    function showStatus(message, type) {
      const statusDiv = document.getElementById('status');
      const colors = {
        info: 'bg-blue-50 border-blue-200 text-blue-800',
        success: 'bg-green-50 border-green-200 text-green-800',
        error: 'bg-red-50 border-red-200 text-red-800'
      };
      statusDiv.className = `mt-6 p-4 rounded-lg border-2 ${colors[type]}`;
      statusDiv.textContent = message;
      statusDiv.classList.remove('hidden');
      
      // إخفاء الرسالة بعد 5 ثواني للنجاح
      if (type === 'success') {
        setTimeout(() => {
          statusDiv.style.opacity = '0';
          setTimeout(() => {
            statusDiv.classList.add('hidden');
            statusDiv.style.opacity = '1';
          }, 300);
        }, 5000);
      }
    }
    
    async function checkExistingExams() {
      try {
        const { data: exams, error } = await supabase
          .from('final_exams')
          .select('lesson_id, questions, total_marks, created_at')
          .order('lesson_id');
        
        if (error) throw error;
        
        if (!exams || exams.length === 0) {
          alert('⚠️ لا توجد اختبارات مولدة بعد');
          return;
        }
        
        // جلب بيانات الدروس
        const { data: lessons } = await supabase
          .from('lessons')
          .select('id, title')
          .in('id', exams.map(e => e.lesson_id));
        
        const lessonMap = {};
        lessons?.forEach(l => lessonMap[l.id] = l.title);
        
        let message = `📊 الاختبارات الموجودة (${exams.length}):\n\n`;
        exams.forEach(exam => {
          const lessonTitle = lessonMap[exam.lesson_id] || `درس ${exam.lesson_id}`;
          const questionsCount = Array.isArray(exam.questions) ? exam.questions.length : 0;
          message += `• ${lessonTitle}: ${questionsCount} سؤال (${exam.total_marks} درجة)\n`;
        });
        
        alert(message);
      } catch (error) {
        alert('❌ خطأ: ' + error.message);
      }
    }

    if (deepseekApiKey) {
      document.getElementById('deepseek-api-key').placeholder = '✓ المفتاح محفوظ';
    }
    
    // إضافة transition للرسالة
    document.getElementById('status').style.transition = 'opacity 0.3s ease';

    loadLessons();
  </script>
</body>
</html>
