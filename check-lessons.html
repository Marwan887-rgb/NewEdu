<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فحص الدروس</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-indigo-700 mb-4">🔍 فحص بيانات الدروس</h1>
    <button onclick="checkLessons()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg mb-4">
      تحميل البيانات
    </button>
    <div id="results" class="space-y-2"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkLessons() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p class="text-gray-600">جاري التحميل...</p>';

      try {
        const { data, error } = await supabase
          .from('lessons')
          .select('*')
          .order('id', { ascending: true });

        if (error) throw error;

        resultsDiv.innerHTML = `
          <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
            <p class="text-green-800 font-bold">✅ تم تحميل ${data.length} درس</p>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-2 text-right text-xs font-medium text-gray-700">ID</th>
                  <th class="px-4 py-2 text-right text-xs font-medium text-gray-700">العنوان</th>
                  <th class="px-4 py-2 text-right text-xs font-medium text-gray-700">الوحدة</th>
                  <th class="px-4 py-2 text-right text-xs font-medium text-gray-700">النوع</th>
                  <th class="px-4 py-2 text-right text-xs font-medium text-gray-700">رابط PPT</th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                ${data.map(lesson => `
                  <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2 text-sm">${lesson.id}</td>
                    <td class="px-4 py-2 text-sm font-semibold">${lesson.title}</td>
                    <td class="px-4 py-2 text-sm">${lesson.unit}</td>
                    <td class="px-4 py-2 text-sm">
                      <span class="px-2 py-1 rounded text-xs ${
                        lesson.type === 'lesson' ? 'bg-blue-100 text-blue-800' :
                        lesson.type === 'review' ? 'bg-yellow-100 text-yellow-800' :
                        lesson.type === 'project' ? 'bg-green-100 text-green-800' :
                        lesson.type === 'exam' ? 'bg-red-100 text-red-800' :
                        'bg-purple-100 text-purple-800'
                      }">${lesson.type}</span>
                    </td>
                    <td class="px-4 py-2 text-sm text-blue-600">
                      ${lesson.powerpoint_link ? 
                        `<a href="${lesson.powerpoint_link}" target="_blank" class="hover:underline">عرض ✓</a>` : 
                        '<span class="text-gray-400">لا يوجد</span>'
                      }
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-lg p-4">
            <p class="text-red-800 font-bold">❌ خطأ: ${error.message}</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
