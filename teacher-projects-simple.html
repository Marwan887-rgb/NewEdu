<!-- Project Review Modal - Full Screen -->
<div id="project-review-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-6xl max-h-[95vh] overflow-y-auto">
    <div class="sticky top-0 bg-white border-b-2 border-gray-200 p-4 flex items-center justify-between z-10">
      <h2 class="text-2xl font-bold text-gray-900">📋 مراجعة واعتماد المشروع</h2>
      <button onclick="closeProjectReviewModal()" 
              class="text-gray-500 hover:text-gray-700 text-3xl font-bold leading-none">
        ×
      </button>
    </div>
    
    <div id="review-modal-content" class="p-6">
      <!-- سيتم ملؤه ديناميكياً -->
    </div>
  </div>
</div>
