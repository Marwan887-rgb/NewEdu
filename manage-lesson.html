<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الدرس الشاملة</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    
    <!-- العنوان -->
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
      <h1 class="text-4xl font-bold text-indigo-700 mb-2">📚 إدارة الدرس الشاملة</h1>
      <p class="text-gray-600">كل ما تحتاجه لإدارة الدرس في مكان واحد</p>
    </div>

    <!-- إعدادات DeepSeek API -->
    <div class="bg-gradient-to-r from-purple-50 to-indigo-50 rounded-xl shadow-lg p-6 mb-6">
      <h2 class="text-xl font-bold text-purple-800 mb-3">🤖 مفتاح DeepSeek API</h2>
      <div class="flex gap-3">
        <input type="password" id="deepseekKeyInput" 
          placeholder="sk-xxxxxxxxxxxxxxxxxx"
          class="flex-1 border-2 border-purple-300 rounded-lg p-3 focus:border-purple-500 focus:outline-none">
        <button onclick="saveApiKey()" 
          class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 rounded-lg">
          💾 حفظ
        </button>
      </div>
      <p class="text-sm text-gray-600 mt-2">
        <span id="keyStatus" class="font-bold"></span>
        • يُحفظ محلياً في المتصفح • مطلوب لتوليد الأسئلة تلقائياً
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- القسم الأيسر: اختيار الدرس والبيانات الأساسية -->
      <div class="lg:col-span-1 space-y-6">
        
        <!-- اختيار الدرس -->
        <div class="bg-white rounded-xl shadow-lg p-6">
          <h2 class="text-2xl font-bold text-gray-800 mb-4">🎯 اختر الدرس</h2>
          
          <select id="lessonSelect" class="w-full border-2 border-gray-300 rounded-lg p-3 mb-4 focus:border-indigo-500 focus:outline-none">
            <option value="">-- اختر درساً --</option>
          </select>

          <div id="lessonInfo" class="hidden">
            <div class="bg-indigo-50 rounded-lg p-4 mb-4">
              <p class="text-sm text-gray-600">الوحدة</p>
              <p class="font-bold text-indigo-800" id="currentUnit"></p>
            </div>
          </div>
        </div>

        <!-- البيانات الأساسية -->
        <div id="basicData" class="hidden bg-white rounded-xl shadow-lg p-6">
          <h2 class="text-2xl font-bold text-gray-800 mb-4">📝 البيانات الأساسية</h2>
          
          <div class="space-y-4">
            <div>
              <label class="block text-gray-700 font-bold mb-2">عنوان الدرس:</label>
              <input type="text" id="lessonTitle" 
                class="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-gray-700 font-bold mb-2">رابط PowerPoint:</label>
              <input type="url" id="powerpointLink" 
                placeholder="https://..." 
                class="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-gray-700 font-bold mb-2">رابط الفيديو:</label>
              <input type="url" id="videoLink" 
                placeholder="https://..." 
                class="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-indigo-500 focus:outline-none">
            </div>

            <button onclick="saveBasicData()" 
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg">
              💾 حفظ البيانات الأساسية
            </button>
          </div>
        </div>

        <!-- الواجب -->
        <div id="homeworkSection" class="hidden bg-white rounded-xl shadow-lg p-6">
          <h2 class="text-2xl font-bold text-gray-800 mb-4">📋 الواجب</h2>
          
          <div class="space-y-4">
            <div>
              <label class="block text-gray-700 font-bold mb-2">سؤال الواجب:</label>
              <textarea id="homeworkQuestion" rows="3"
                class="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"></textarea>
            </div>

            <div>
              <label class="block text-gray-700 font-bold mb-2">تعليمات إضافية:</label>
              <textarea id="homeworkInstructions" rows="2"
                class="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"></textarea>
            </div>

            <button onclick="saveHomework()" 
              class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">
              💾 حفظ الواجب
            </button>
          </div>
        </div>

      </div>

      <!-- القسم الأوسط: ورقة العمل -->
      <div class="lg:col-span-1 space-y-6">
        
        <div id="worksheetSection" class="hidden bg-white rounded-xl shadow-lg p-6">
          <h2 class="text-2xl font-bold text-gray-800 mb-4">📄 ورقة العمل</h2>
          
          <div class="space-y-4">
            <div>
              <label class="block text-gray-700 font-bold mb-2">محتوى الدرس:</label>
              <textarea id="worksheetContent" rows="8"
                placeholder="الصق محتوى الدرس هنا..."
                class="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"></textarea>
            </div>

            <button onclick="generateWorksheet()" 
              class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg">
              🤖 توليد ورقة العمل (DeepSeek)
            </button>

            <div id="worksheetResult" class="hidden">
              <label class="block text-gray-700 font-bold mb-2">الأسئلة المولّدة:</label>
              <textarea id="worksheetQuestions" rows="10"
                class="w-full border-2 border-gray-300 rounded-lg p-3 bg-gray-50"></textarea>
              
              <button onclick="saveWorksheet()" 
                class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">
                💾 حفظ ورقة العمل
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- القسم الأيمن: التقويم النهائي -->
      <div class="lg:col-span-1 space-y-6">
        
        <div id="examSection" class="hidden bg-white rounded-xl shadow-lg p-6">
          <h2 class="text-2xl font-bold text-gray-800 mb-4">📝 التقويم النهائي</h2>
          
          <div class="space-y-4">
            <div>
              <label class="block text-gray-700 font-bold mb-2">محتوى الدرس:</label>
              <textarea id="examContent" rows="8"
                placeholder="الصق محتوى الدرس هنا..."
                class="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"></textarea>
            </div>

            <button onclick="generateExam()" 
              class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg">
              🤖 توليد التقويم (DeepSeek)
            </button>

            <div id="examResult" class="hidden">
              <label class="block text-gray-700 font-bold mb-2">الأسئلة المولّدة:</label>
              <textarea id="examQuestions" rows="10"
                class="w-full border-2 border-gray-300 rounded-lg p-3 bg-gray-50"></textarea>
              
              <button onclick="saveExam()" 
                class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">
                💾 حفظ التقويم النهائي
              </button>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- رسائل الحالة -->
    <div id="statusMessages" class="mt-6"></div>

  </div>

  <script>
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let selectedLessonId = null;
    let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';

    // حفظ مفتاح API
    function saveApiKey() {
      const key = document.getElementById('deepseekKeyInput').value.trim();
      if (!key) {
        showStatus('⚠️ الرجاء إدخال المفتاح', 'error');
        return;
      }
      if (!key.startsWith('sk-')) {
        showStatus('⚠️ المفتاح يجب أن يبدأ بـ sk-', 'error');
        return;
      }
      localStorage.setItem('deepseek_api_key', key);
      deepseekApiKey = key;
      updateKeyStatus();
      showStatus('✅ تم حفظ المفتاح بنجاح', 'success');
    }

    // تحديث حالة المفتاح
    function updateKeyStatus() {
      const status = document.getElementById('keyStatus');
      if (deepseekApiKey && deepseekApiKey.startsWith('sk-')) {
        status.textContent = '✅ المفتاح محفوظ';
        status.className = 'font-bold text-green-600';
      } else {
        status.textContent = '⚠️ لم يتم حفظ المفتاح';
        status.className = 'font-bold text-orange-600';
      }
    }

    // تحميل الدروس
    async function loadLessons() {
      const { data, error } = await supabase
        .from('lessons')
        .select('*')
        .eq('type', 'lesson')
        .order('id');

      if (error) {
        showStatus('خطأ في تحميل الدروس', 'error');
        return;
      }

      const select = document.getElementById('lessonSelect');
      data.forEach(lesson => {
        const option = document.createElement('option');
        option.value = lesson.id;
        option.textContent = `${lesson.id}. ${lesson.title} - ${lesson.unit}`;
        select.appendChild(option);
      });
    }

    // عند اختيار درس
    document.getElementById('lessonSelect').addEventListener('change', async function() {
      selectedLessonId = this.value;
      
      if (!selectedLessonId) {
        document.getElementById('lessonInfo').classList.add('hidden');
        document.getElementById('basicData').classList.add('hidden');
        document.getElementById('homeworkSection').classList.add('hidden');
        document.getElementById('worksheetSection').classList.add('hidden');
        document.getElementById('examSection').classList.add('hidden');
        return;
      }

      // تحميل بيانات الدرس
      const { data: lesson } = await supabase
        .from('lessons')
        .select('*')
        .eq('id', selectedLessonId)
        .single();

      if (lesson) {
        document.getElementById('currentUnit').textContent = lesson.unit;
        document.getElementById('lessonTitle').value = lesson.title || '';
        document.getElementById('powerpointLink').value = lesson.powerpoint_link || '';
        document.getElementById('videoLink').value = lesson.video_link || '';
        
        document.getElementById('lessonInfo').classList.remove('hidden');
        document.getElementById('basicData').classList.remove('hidden');
        document.getElementById('homeworkSection').classList.remove('hidden');
        document.getElementById('worksheetSection').classList.remove('hidden');
        document.getElementById('examSection').classList.remove('hidden');

        // تحميل الواجب إن وجد
        const { data: homework } = await supabase
          .from('homeworks')
          .select('*')
          .eq('lesson_id', selectedLessonId)
          .single();

        if (homework) {
          document.getElementById('homeworkQuestion').value = homework.question || '';
          document.getElementById('homeworkInstructions').value = homework.instructions || '';
        } else {
          document.getElementById('homeworkQuestion').value = '';
          document.getElementById('homeworkInstructions').value = '';
        }

        // 1️⃣ مسح المحتوى القديم أولاً (ليتأكد المستخدم)
        console.log('🗑️ جاري مسح المحتوى القديم...');
        showStatus('🗑️ مسح المحتوى القديم...', 'info');
        
        document.getElementById('worksheetContent').value = '';
        document.getElementById('examContent').value = '';
        document.getElementById('worksheetResult').classList.add('hidden');
        document.getElementById('examResult').classList.add('hidden');
        
        // 2️⃣ انتظار قصير ليرى المستخدم المسح
        await new Promise(resolve => setTimeout(resolve, 300));
        
        // 3️⃣ تحميل المحتوى الجديد
        console.log('🔍 جاري تحميل محتوى الدرس رقم:', selectedLessonId);
        showStatus('⏳ جاري تحميل محتوى الدرس...', 'info');
        
        const { data: lessonContent, error: contentError } = await supabase
          .from('lesson_content')
          .select('content')
          .eq('lesson_id', selectedLessonId)
          .single();

        console.log('📦 نتيجة التحميل:', { lessonContent, contentError });

        if (lessonContent && lessonContent.content) {
          // ملء محتوى ورقة العمل تلقائياً
          document.getElementById('worksheetContent').value = lessonContent.content;
          // ملء محتوى التقويم تلقائياً
          document.getElementById('examContent').value = lessonContent.content;
          showStatus('✅ تم تحميل محتوى الدرس تلقائياً (' + lessonContent.content.length + ' حرف)', 'success');
          console.log('✅ تم تحميل المحتوى بنجاح');
        } else {
          showStatus('⚠️ لا يوجد محتوى محفوظ لهذا الدرس. يمكنك إضافته من صفحة "إضافة محتوى الدروس"', 'warning');
          console.log('⚠️ لا يوجد محتوى لهذا الدرس');
        }
      }
    });

    // حفظ البيانات الأساسية
    async function saveBasicData() {
      if (!selectedLessonId) return;

      const title = document.getElementById('lessonTitle').value.trim();
      const powerpointLink = document.getElementById('powerpointLink').value.trim();
      const videoLink = document.getElementById('videoLink').value.trim();

      const { error } = await supabase
        .from('lessons')
        .update({
          title: title,
          powerpoint_link: powerpointLink,
          video_link: videoLink
        })
        .eq('id', selectedLessonId);

      if (error) {
        showStatus('خطأ في حفظ البيانات', 'error');
      } else {
        showStatus('✅ تم حفظ البيانات الأساسية بنجاح', 'success');
      }
    }

    // حفظ الواجب
    async function saveHomework() {
      if (!selectedLessonId) return;

      const question = document.getElementById('homeworkQuestion').value.trim();
      const instructions = document.getElementById('homeworkInstructions').value.trim();

      if (!question) {
        showStatus('⚠️ الرجاء إدخال سؤال الواجب', 'error');
        return;
      }

      const { error } = await supabase
        .from('homeworks')
        .upsert({
          lesson_id: selectedLessonId,
          question: question,
          instructions: instructions
        }, { onConflict: 'lesson_id' });

      if (error) {
        showStatus('خطأ في حفظ الواجب: ' + error.message, 'error');
      } else {
        showStatus('✅ تم حفظ الواجب بنجاح', 'success');
      }
    }

    // توليد ورقة العمل (مع إعادة محاولة)
    async function generateWorksheet() {
      const content = document.getElementById('worksheetContent').value.trim();
      
      if (!content) {
        showStatus('⚠️ الرجاء إدخال محتوى الدرس', 'error');
        return;
      }

      if (!deepseekApiKey || !deepseekApiKey.startsWith('sk-')) {
        showStatus('⚠️ الرجاء إدخال مفتاح DeepSeek في الأعلى وحفظه أولاً', 'error');
        return;
      }

      // محاولة مع إعادة
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          showStatus(`⏳ جاري التوليد... (المحاولة ${attempt}/3)`, 'info');
          
          const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${deepseekApiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{
              role: 'user',
              content: `بناءً على المحتوى التعليمي التالي، أنشئ 6 أسئلة تعليمية دقيقة ومتنوعة مع إجابات نموذجية:

- الأسئلة 1-3: أسئلة قصيرة ومباشرة (type: "short")
- الأسئلة 4-6: أسئلة تفكير وتحليل عميقة (type: "analysis")

المحتوى:
${content}

يجب أن تكون الإجابة بصيغة JSON array فقط، بدون أي نص إضافي. كل سؤال يجب أن يحتوي على إجابة نموذجية:
[
  {"type":"short","question":"السؤال هنا","model_answer":"الإجابة النموذجية هنا"},
  {"type":"analysis","question":"السؤال هنا","model_answer":"الإجابة النموذجية المفصلة هنا"}
]`
            }],
            temperature: 0.7,
            max_tokens: 2000
          })
        });

        const data = await response.json();
        
        console.log('DeepSeek Response:', data);
        
        if (data.error) {
          throw new Error(data.error.message || 'خطأ من DeepSeek');
        }
        
        if (!data.choices || !data.choices[0]) {
          throw new Error('لا توجد إجابة من DeepSeek');
        }
        
        const questions = data.choices[0].message.content;
        
          document.getElementById('worksheetQuestions').value = questions;
          document.getElementById('worksheetResult').classList.remove('hidden');
          showStatus('✅ تم توليد ورقة العمل', 'success');
          return; // نجحت - اخرج من الحلقة
          
        } catch (error) {
          console.error(`Worksheet Error (attempt ${attempt}):`, error);
          
          if (attempt === 3) {
            // آخر محاولة - أظهر الخطأ
            showStatus('❌ خطأ بعد 3 محاولات: ' + error.message, 'error');
          } else {
            // انتظر ثانية واحدة ثم أعد المحاولة
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
        }
      }
    }

    // حفظ ورقة العمل
    async function saveWorksheet() {
      if (!selectedLessonId) return;

      const questionsText = document.getElementById('worksheetQuestions').value.trim();
      
      if (!questionsText) return;

      try {
        const questions = JSON.parse(questionsText);
        
        const { error } = await supabase
          .from('worksheets')
          .upsert({
            lesson_id: selectedLessonId,
            questions: questions
          }, { onConflict: 'lesson_id' });

        if (error) {
          showStatus('خطأ في حفظ ورقة العمل: ' + error.message, 'error');
        } else {
          showStatus('✅ تم حفظ ورقة العمل بنجاح', 'success');
        }
      } catch (e) {
        showStatus('خطأ في صيغة JSON: ' + e.message, 'error');
      }
    }

    // توليد التقويم النهائي (مع إعادة محاولة)
    async function generateExam() {
      const content = document.getElementById('examContent').value.trim();
      
      if (!content) {
        showStatus('⚠️ الرجاء إدخال محتوى الدرس', 'error');
        return;
      }

      if (!deepseekApiKey || !deepseekApiKey.startsWith('sk-')) {
        showStatus('⚠️ الرجاء إدخال مفتاح DeepSeek في الأعلى وحفظه أولاً', 'error');
        return;
      }

      // محاولة مع إعادة
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          showStatus(`⏳ جاري التوليد... (المحاولة ${attempt}/3)`, 'info');
          
          const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${deepseekApiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{
              role: 'user',
              content: `بناءً على محتوى الدرس، أنشئ 6 أسئلة تركز على أهداف الدرس الرئيسية، تكون سهلة وبسيطة وواضحة:

- الأسئلة 1-3: صح/خطأ (type: "true_false", answer: true أو false)
- الأسئلة 4-6: اختيار من متعدد (type: "mcq", options: ["أ","ب","ج","د"], answer: "أ")

محتوى الدرس:
${content}

يجب أن تكون الإجابة بصيغة JSON array فقط، بدون أي نص إضافي:
[
  {"type":"true_false","question":"السؤال","answer":true},
  {"type":"mcq","question":"السؤال","options":["أ","ب","ج","د"],"answer":"أ"}
]`
            }],
            temperature: 0.7,
            max_tokens: 2000
          })
        });

        const data = await response.json();
        
        console.log('DeepSeek Exam Response:', data);
        
        if (data.error) {
          throw new Error(data.error.message || 'خطأ من DeepSeek');
        }
        
        if (!data.choices || !data.choices[0]) {
          throw new Error('لا توجد إجابة من DeepSeek');
        }
        
        const questions = data.choices[0].message.content;
        
          document.getElementById('examQuestions').value = questions;
          document.getElementById('examResult').classList.remove('hidden');
          showStatus('✅ تم توليد التقويم النهائي', 'success');
          return; // نجحت - اخرج من الحلقة
          
        } catch (error) {
          console.error(`Exam Error (attempt ${attempt}):`, error);
          
          if (attempt === 3) {
            // آخر محاولة - أظهر الخطأ
            showStatus('❌ خطأ بعد 3 محاولات: ' + error.message, 'error');
          } else {
            // انتظر ثانية واحدة ثم أعد المحاولة
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
        }
      }
    }

    // حفظ التقويم النهائي
    async function saveExam() {
      if (!selectedLessonId) return;

      const questionsText = document.getElementById('examQuestions').value.trim();
      
      if (!questionsText) return;

      try {
        const questions = JSON.parse(questionsText);
        
        const { error } = await supabase
          .from('final_exams')
          .upsert({
            lesson_id: selectedLessonId,
            questions: questions,
            total_questions: questions.length
          }, { onConflict: 'lesson_id' });

        if (error) {
          showStatus('خطأ في حفظ التقويم: ' + error.message, 'error');
        } else {
          showStatus('✅ تم حفظ التقويم النهائي بنجاح', 'success');
        }
      } catch (e) {
        showStatus('خطأ في صيغة JSON: ' + e.message, 'error');
      }
    }

    // عرض رسالة الحالة
    function showStatus(message, type) {
      const container = document.getElementById('statusMessages');
      const colors = {
        success: 'bg-green-100 text-green-800 border-green-300',
        error: 'bg-red-100 text-red-800 border-red-300',
        info: 'bg-blue-100 text-blue-800 border-blue-300'
      };

      const div = document.createElement('div');
      div.className = `p-4 rounded-lg border-2 mb-3 ${colors[type] || colors.info}`;
      div.textContent = message;
      
      container.appendChild(div);
      
      setTimeout(() => div.remove(), 5000);
    }

    // تحميل الدروس عند فتح الصفحة
    loadLessons();
    updateKeyStatus();
  </script>

</body>
</html>
