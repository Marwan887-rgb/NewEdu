<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار التلجرام المباشر</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin: 0 0 20px 0;
      text-align: center;
    }
    .test-box {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin: 15px 0;
      border: 2px solid #e0e0e0;
    }
    .test-box h3 {
      margin: 0 0 15px 0;
      color: #333;
      font-size: 16px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      margin: 8px 0;
      font-family: 'Courier New', monospace;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #5568d3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .result.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .result.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .result.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    label {
      display: block;
      margin: 10px 0 5px 0;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 اختبار التلجرام المباشر</h1>
    
    <div class="test-box">
      <h3>1️⃣ اختبار التوكن</h3>
      <label>توكن البوت:</label>
      <input type="password" id="bot-token" placeholder="123456:ABC...">
      <button onclick="testToken()">🔍 اختبار التوكن</button>
      <div id="token-result"></div>
    </div>

    <div class="test-box">
      <h3>2️⃣ اختبار إرسال رسالة</h3>
      <label>Chat ID:</label>
      <input type="text" id="chat-id" placeholder="123456789">
      <label>الرسالة:</label>
      <textarea id="message" rows="3" placeholder="مرحباً! هذا اختبار للبوت">مرحباً! 🔐
هذا اختبار لإرسال رسالة عبر البوت.

إذا وصلتك هذه الرسالة، البوت يعمل بنجاح! ✅</textarea>
      <button onclick="sendTestMessage()">📤 إرسال رسالة اختبار</button>
      <div id="send-result"></div>
    </div>

    <div class="test-box">
      <h3>3️⃣ اختبار OTP كامل</h3>
      <label>Chat ID للطالب:</label>
      <input type="text" id="otp-chat-id" placeholder="123456789">
      <label>اسم الطالب:</label>
      <input type="text" id="student-name" placeholder="أحمد محمد">
      <button onclick="sendOTPTest()">🔐 إرسال OTP اختبار</button>
      <div id="otp-result"></div>
    </div>
  </div>

  <script>
    // 1. اختبار التوكن
    async function testToken() {
      const token = document.getElementById('bot-token').value.trim();
      const resultDiv = document.getElementById('token-result');
      
      if (!token) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '❌ يرجى إدخال التوكن';
        return;
      }
      
      resultDiv.className = 'result info';
      resultDiv.textContent = '⏳ جاري الاختبار...';
      
      try {
        const apiUrl = `https://api.telegram.org/bot${token}/getMe`;
        const response = await fetch(apiUrl);
        const data = await response.json();
        
        if (data.ok) {
          resultDiv.className = 'result success';
          resultDiv.textContent = `✅ البوت نشط!\n\n` +
            `الاسم: ${data.result.first_name}\n` +
            `Username: @${data.result.username}\n` +
            `Bot ID: ${data.result.id}\n` +
            `Can Join Groups: ${data.result.can_join_groups ? 'نعم' : 'لا'}\n` +
            `Can Read Messages: ${data.result.can_read_all_group_messages ? 'نعم' : 'لا'}`;
        } else {
          resultDiv.className = 'result error';
          resultDiv.textContent = `❌ خطأ: ${data.description}\n\nالتوكن غير صحيح أو البوت محذوف`;
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.textContent = `❌ خطأ في الاتصال:\n${error.message}`;
      }
    }

    // 2. اختبار إرسال رسالة
    async function sendTestMessage() {
      const token = document.getElementById('bot-token').value.trim();
      const chatId = document.getElementById('chat-id').value.trim();
      const message = document.getElementById('message').value.trim();
      const resultDiv = document.getElementById('send-result');
      
      if (!token) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '❌ يرجى إدخال التوكن أولاً';
        return;
      }
      
      if (!chatId) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '❌ يرجى إدخال Chat ID';
        return;
      }
      
      if (!message) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '❌ يرجى إدخال رسالة';
        return;
      }
      
      resultDiv.className = 'result info';
      resultDiv.textContent = '⏳ جاري الإرسال...';
      
      try {
        const apiUrl = `https://api.telegram.org/bot${token}/sendMessage`;
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: chatId,
            text: message
          })
        });
        
        const data = await response.json();
        
        if (data.ok) {
          resultDiv.className = 'result success';
          resultDiv.textContent = `✅ تم الإرسال بنجاح!\n\n` +
            `Message ID: ${data.result.message_id}\n` +
            `التاريخ: ${new Date(data.result.date * 1000).toLocaleString('ar')}\n\n` +
            `تحقق من التلجرام الآن!`;
        } else {
          resultDiv.className = 'result error';
          resultDiv.textContent = `❌ فشل الإرسال:\n${data.description}\n\n` +
            `السبب المحتمل:\n` +
            `- Chat ID غير صحيح\n` +
            `- الطالب لم يبدأ محادثة مع البوت\n` +
            `- البوت محظور من قبل الطالب`;
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.textContent = `❌ خطأ في الإرسال:\n${error.message}`;
      }
    }

    // 3. اختبار OTP كامل
    async function sendOTPTest() {
      const token = document.getElementById('bot-token').value.trim();
      const chatId = document.getElementById('otp-chat-id').value.trim();
      const studentName = document.getElementById('student-name').value.trim();
      const resultDiv = document.getElementById('otp-result');
      
      if (!token) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '❌ يرجى إدخال التوكن أولاً';
        return;
      }
      
      if (!chatId) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '❌ يرجى إدخال Chat ID';
        return;
      }
      
      if (!studentName) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '❌ يرجى إدخال اسم الطالب';
        return;
      }
      
      // إنشاء كود OTP عشوائي
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      
      const message = `🔐 مرحباً ${studentName}!\n\nرمز التحقق الخاص بك:\n\n${code}\n\n⏰ صالح لمدة 10 دقائق\n\n⚠️ لا تشارك هذا الرمز مع أي شخص`;
      
      resultDiv.className = 'result info';
      resultDiv.textContent = `⏳ جاري إرسال OTP...\nالكود: ${code}`;
      
      try {
        const apiUrl = `https://api.telegram.org/bot${token}/sendMessage`;
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: chatId,
            text: message
          })
        });
        
        const data = await response.json();
        
        if (data.ok) {
          resultDiv.className = 'result success';
          resultDiv.textContent = `✅ تم إرسال OTP بنجاح!\n\n` +
            `الكود المُرسل: ${code}\n` +
            `إلى: ${studentName}\n` +
            `Chat ID: ${chatId}\n` +
            `Message ID: ${data.result.message_id}\n\n` +
            `✅ تحقق من التلجرام الآن!\n` +
            `✅ يجب أن تصل رسالة بنفس الكود أعلاه`;
        } else {
          resultDiv.className = 'result error';
          resultDiv.textContent = `❌ فشل إرسال OTP:\n${data.description}\n\n` +
            `الكود كان: ${code}\n` +
            `(لم يتم إرساله)\n\n` +
            `تحقق من:\n` +
            `- Chat ID صحيح؟\n` +
            `- الطالب بدأ محادثة مع البوت؟\n` +
            `- البوت غير محظور؟`;
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.textContent = `❌ خطأ في إرسال OTP:\n${error.message}\n\nالكود كان: ${code}\n(لم يتم إرساله)`;
      }
    }
  </script>
</body>
</html>
