<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد أيقونات EduActive</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }
    .container {
      background: white;
      color: #333;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #7c3aed;
      margin-bottom: 30px;
    }
    .preview {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    canvas {
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .info {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }
    .upload-area {
      border: 2px dashed #667eea;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      background: #f8f9ff;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-area:hover {
      background: #f0f2ff;
      border-color: #764ba2;
    }
    .upload-area.dragover {
      background: #e8ebff;
      border-color: #764ba2;
    }
    input[type="file"] {
      display: none;
    }
    .upload-label {
      display: block;
      cursor: pointer;
      color: #667eea;
      font-weight: bold;
    }
    .upload-label:hover {
      color: #764ba2;
    }
    .preview-image {
      max-width: 150px;
      max-height: 150px;
      border-radius: 10px;
      margin: 10px auto;
      display: block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 مولد أيقونات EduActive</h1>
    
    <!-- رفع صورة مخصصة -->
    <div class="upload-area" id="uploadArea">
      <label for="imageUpload" class="upload-label">
        📸 اضغط لرفع صورة أو اسحبها هنا
      </label>
      <input type="file" id="imageUpload" accept="image/*">
      <div id="imagePreview" style="display: none;">
        <img id="previewImg" class="preview-image" alt="Preview">
        <p style="margin-top: 10px; font-size: 12px; color: #666;">الصورة المرفوعة</p>
      </div>
    </div>
    
    <div class="preview">
      <div>
        <p style="text-align: center; margin-bottom: 10px; font-weight: bold;">192x192</p>
        <canvas id="icon192" width="192" height="192"></canvas>
      </div>
      <div>
        <p style="text-align: center; margin-bottom: 10px; font-weight: bold;">512x512</p>
        <canvas id="icon512" width="512" height="512"></canvas>
      </div>
    </div>
    
    <div class="buttons">
      <button onclick="generateIcons()">🔄 إنشاء الأيقونات (تصميم تلقائي)</button>
      <button onclick="generateFromImage()">🎨 إنشاء من الصورة المرفوعة</button>
      <button onclick="downloadIcon('icon192', 'icon-192.png')">⬇️ تحميل 192x192</button>
      <button onclick="downloadIcon('icon512', 'icon-512.png')">⬇️ تحميل 512x512</button>
      <button onclick="downloadBoth()">⬇️ تحميل الكل</button>
    </div>
    
    <div class="info">
      <p>📝 بعد التحميل، ضع الملفات في المجلد الرئيسي للمشروع</p>
      <p>✅ الملفات: <code>icon-192.png</code> و <code>icon-512.png</code></p>
    </div>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const scale = size / 512; // تصميم أساسي بحجم 512 ثم التكبير/التصغير
      
      // مسح Canvas
      ctx.clearRect(0, 0, size, size);
      
      // خلفية متدرجة بنفسجية
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#a78bfa');
      gradient.addColorStop(0.5, '#8b5cf6');
      gradient.addColorStop(1, '#7c3aed');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // إضافة تأثير دائري مشع
      const centerX = size / 2;
      const centerY = size / 2;
      const radius = size * 0.4;
      
      const radialGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      radialGradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
      radialGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = radialGradient;
      ctx.fillRect(0, 0, size, size);
      
      // رسم أيقونة الكتاب
      ctx.save();
      ctx.translate(centerX, centerY);
      
      // الكتاب المفتوح
      ctx.fillStyle = 'white';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = size * 0.02;
      
      // صفحة الكتاب اليسرى
      ctx.beginPath();
      ctx.moveTo(-size * 0.15, -size * 0.2);
      ctx.lineTo(-size * 0.15, size * 0.2);
      ctx.lineTo(0, size * 0.25);
      ctx.lineTo(0, -size * 0.15);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      
      // صفحة الكتاب اليمنى
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.15);
      ctx.lineTo(0, size * 0.25);
      ctx.lineTo(size * 0.15, size * 0.2);
      ctx.lineTo(size * 0.15, -size * 0.2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      
      // خطوط الكتاب
      ctx.strokeStyle = 'rgba(167, 139, 250, 0.5)';
      ctx.lineWidth = size * 0.01;
      
      // خطوط في الصفحة اليسرى
      for (let i = -0.15; i <= 0.15; i += 0.1) {
        ctx.beginPath();
        ctx.moveTo(-size * 0.12, size * 0.05 * i);
        ctx.lineTo(-size * 0.02, size * 0.05 * i + size * 0.02);
        ctx.stroke();
      }
      
      // خطوط في الصفحة اليمنى
      for (let i = -0.15; i <= 0.15; i += 0.1) {
        ctx.beginPath();
        ctx.moveTo(size * 0.02, size * 0.05 * i + size * 0.02);
        ctx.lineTo(size * 0.12, size * 0.05 * i);
        ctx.stroke();
      }
      
      // رمز التعلم (نجمة صغيرة)
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      const starSize = size * 0.08;
      const starX = -size * 0.25;
      const starY = -size * 0.25;
      for (let i = 0; i < 5; i++) {
        const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const x = starX + starSize * Math.cos(angle);
        const y = starY + starSize * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      
      ctx.restore();
      
      // إضافة ظل خفيف
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = size * 0.05;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = size * 0.02;
    }
    
    function generateIcons() {
      const canvas192 = document.getElementById('icon192');
      const canvas512 = document.getElementById('icon512');
      
      drawIcon(canvas192, 192);
      drawIcon(canvas512, 512);
      
      console.log('✅ تم إنشاء الأيقونات بنجاح!');
    }
    
    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
      console.log(`✅ تم تحميل ${filename}`);
    }
    
    function downloadBoth() {
      downloadIcon('icon192', 'icon-192.png');
      setTimeout(() => {
        downloadIcon('icon512', 'icon-512.png');
      }, 500);
    }
    
    let uploadedImage = null;
    
    // معالجة رفع الصورة
    document.getElementById('imageUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedImage = new Image();
          uploadedImage.onload = () => {
            document.getElementById('previewImg').src = event.target.result;
            document.getElementById('imagePreview').style.display = 'block';
          };
          uploadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
    
    // معالجة السحب والإفلات
    const uploadArea = document.getElementById('uploadArea');
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        document.getElementById('imageUpload').files = e.dataTransfer.files;
        document.getElementById('imageUpload').dispatchEvent(new Event('change'));
      }
    });
    
    // إنشاء الأيقونات من الصورة المرفوعة
    function generateFromImage() {
      if (!uploadedImage) {
        alert('⚠️ يرجى رفع صورة أولاً');
        return;
      }
      
      const canvas192 = document.getElementById('icon192');
      const canvas512 = document.getElementById('icon512');
      
      drawImageIcon(canvas192, 192);
      drawImageIcon(canvas512, 512);
      
      console.log('✅ تم إنشاء الأيقونات من الصورة بنجاح!');
    }
    
    function drawImageIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // مسح Canvas
      ctx.clearRect(0, 0, size, size);
      
      // خلفية متدرجة (اختيارية - يمكن إزالتها)
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#a78bfa');
      gradient.addColorStop(0.5, '#8b5cf6');
      gradient.addColorStop(1, '#7c3aed');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // حساب أبعاد الصورة لتتناسب مع Canvas مع الحفاظ على النسبة
      const imgWidth = uploadedImage.width;
      const imgHeight = uploadedImage.height;
      const aspectRatio = imgWidth / imgHeight;
      
      let drawWidth, drawHeight, offsetX, offsetY;
      
      if (aspectRatio > 1) {
        // الصورة أفقية
        drawWidth = size * 0.9;
        drawHeight = drawWidth / aspectRatio;
        offsetX = (size - drawWidth) / 2;
        offsetY = (size - drawHeight) / 2;
      } else {
        // الصورة عمودية أو مربعة
        drawHeight = size * 0.9;
        drawWidth = drawHeight * aspectRatio;
        offsetX = (size - drawWidth) / 2;
        offsetY = (size - drawHeight) / 2;
      }
      
      // رسم الصورة مع حواف مستديرة
      ctx.save();
      
      // إنشاء مسار مستدير
      const radius = size * 0.1;
      ctx.beginPath();
      ctx.moveTo(offsetX + radius, offsetY);
      ctx.lineTo(offsetX + drawWidth - radius, offsetY);
      ctx.quadraticCurveTo(offsetX + drawWidth, offsetY, offsetX + drawWidth, offsetY + radius);
      ctx.lineTo(offsetX + drawWidth, offsetY + drawHeight - radius);
      ctx.quadraticCurveTo(offsetX + drawWidth, offsetY + drawHeight, offsetX + drawWidth - radius, offsetY + drawHeight);
      ctx.lineTo(offsetX + radius, offsetY + drawHeight);
      ctx.quadraticCurveTo(offsetX, offsetY + drawHeight, offsetX, offsetY + drawHeight - radius);
      ctx.lineTo(offsetX, offsetY + radius);
      ctx.quadraticCurveTo(offsetX, offsetY, offsetX + radius, offsetY);
      ctx.closePath();
      ctx.clip();
      
      // رسم الصورة
      ctx.drawImage(uploadedImage, offsetX, offsetY, drawWidth, drawHeight);
      
      ctx.restore();
      
      // إضافة ظل خفيف
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = size * 0.05;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = size * 0.02;
    }
    
    // إنشاء الأيقونات تلقائياً عند تحميل الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      generateIcons();
    });
  </script>
</body>
</html>
