<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توليد أوراق العمل - DeepSeek AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-50 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
      <h1 class="text-3xl font-bold text-indigo-700 mb-2 flex items-center gap-3">
        <span>🤖</span>
        <span>توليد أوراق العمل - DeepSeek AI</span>
      </h1>
      <p class="text-gray-600">استخدم DeepSeek API لتوليد أسئلة ذكية تلقائياً</p>
    </div>

    <!-- API Key Section -->
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">⚙️ إعدادات API</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">DeepSeek API Key</label>
          <input type="password" id="deepseek-api-key" 
                 class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none"
                 placeholder="أدخل مفتاح DeepSeek API">
        </div>
        <button onclick="saveApiKey()" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold transition">
          💾 حفظ المفتاح
        </button>
      </div>
    </div>

    <!-- Lessons List -->
    <div class="bg-white rounded-2xl shadow-xl p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">📚 الدروس</h2>
      <div id="lessons-container" class="space-y-3"></div>
    </div>

    <!-- Status -->
    <div id="status" class="mt-6 p-4 rounded-lg hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';

    function saveApiKey() {
      const key = document.getElementById('deepseek-api-key').value.trim();
      if (!key) {
        showStatus('⚠️ الرجاء إدخال مفتاح API', 'error');
        return;
      }
      localStorage.setItem('deepseek_api_key', key);
      deepseekApiKey = key;
      showStatus('✅ تم حفظ المفتاح بنجاح', 'success');
      document.getElementById('deepseek-api-key').value = '';
    }

    async function loadLessons() {
      try {
        const { data, error } = await supabase
          .from('lessons')
          .select('*')
          .eq('type', 'lesson')
          .order('id');

        if (error) throw error;

        const container = document.getElementById('lessons-container');
        container.innerHTML = data.map(lesson => `
          <div class="border-2 border-gray-200 rounded-xl p-4 hover:border-indigo-300 transition">
            <div class="flex items-start justify-between gap-4">
              <div class="flex-1">
                <h3 class="font-bold text-gray-900 mb-1">${lesson.title}</h3>
                <p class="text-sm text-gray-600">${lesson.unit}</p>
                <div class="mt-2">
                  <textarea 
                         id="content-${lesson.id}" 
                         rows="3"
                         placeholder="الصق محتوى الدرس هنا..."
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-indigo-500 focus:outline-none resize-none"></textarea>
                </div>
              </div>
              <button onclick="generateWorksheet(${lesson.id})" 
                      class="flex-shrink-0 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-4 py-2 rounded-lg font-semibold transition transform hover:scale-105">
                🤖 توليد
              </button>
            </div>
          </div>
        `).join('');

      } catch (error) {
        showStatus('❌ خطأ في تحميل الدروس: ' + error.message, 'error');
      }
    }

    async function generateWorksheet(lessonId) {
      if (!deepseekApiKey) {
        showStatus('⚠️ الرجاء إدخال مفتاح DeepSeek API أولاً', 'error');
        return;
      }

      const content = document.getElementById(`content-${lessonId}`).value.trim();

      if (!content) {
        showStatus('⚠️ الرجاء لصق محتوى الدرس', 'error');
        return;
      }

      if (content.length < 50) {
        showStatus('⚠️ المحتوى قصير جداً (50 حرف على الأقل)', 'error');
        return;
      }

      showStatus('⏳ جاري توليد الأسئلة باستخدام DeepSeek AI...', 'info');

      try {
        const questions = await generateQuestionsWithDeepSeek(content);

        const { error } = await supabase
          .from('worksheets')
          .upsert({ 
            lesson_id: lessonId, 
            questions: questions,
            updated_at: new Date().toISOString()
          }, { onConflict: 'lesson_id' });

        if (error) throw error;

        showStatus('✅ تم توليد ورقة العمل بنجاح!', 'success');
        displayQuestions(questions);

      } catch (error) {
        showStatus('❌ خطأ: ' + error.message, 'error');
      }
    }

    async function generateQuestionsWithDeepSeek(content) {
      const prompt = `بناءً على المحتوى التعليمي التالي، أنشئ 6 أسئلة تعليمية دقيقة ومتنوعة:

- الأسئلة 1-3: أسئلة قصيرة ومباشرة (type: "short")
- الأسئلة 4-6: أسئلة تفكير وتحليل عميقة (type: "analysis")

المحتوى:
${content}

أعد الأسئلة بصيغة JSON فقط بدون أي نص إضافي:
[
  {"number": 1, "question": "السؤال الأول؟", "type": "short"},
  {"number": 2, "question": "السؤال الثاني؟", "type": "short"},
  {"number": 3, "question": "السؤال الثالث؟", "type": "short"},
  {"number": 4, "question": "السؤال الرابع؟", "type": "analysis"},
  {"number": 5, "question": "السؤال الخامس؟", "type": "analysis"},
  {"number": 6, "question": "السؤال السادس؟", "type": "analysis"}
]`;

      try {
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${deepseekApiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              {
                role: 'system',
                content: 'أنت مساعد تعليمي متخصص في إنشاء أسئلة تعليمية عالية الجودة باللغة العربية. أجب فقط بصيغة JSON المطلوبة.'
              },
              {
                role: 'user',
                content: prompt
              }
            ],
            temperature: 0.7,
            max_tokens: 2000
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          console.error('DeepSeek API Error:', errorData);
          throw new Error(`DeepSeek API Error (${response.status}): ${errorData.error?.message || 'تحقق من صحة API Key'}`);
        }

        const data = await response.json();
        console.log('DeepSeek Response:', data);
        
        if (!data.choices || !data.choices[0] || !data.choices[0].message) {
          throw new Error('استجابة غير متوقعة من DeepSeek');
        }

        const text = data.choices[0].message.content;
        console.log('Generated Text:', text);
        
        // استخراج JSON
        let jsonText = text.trim();
        
        // إزالة code blocks
        const codeBlockMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
        if (codeBlockMatch) {
          jsonText = codeBlockMatch[1].trim();
        }
        
        // البحث عن array
        const jsonMatch = jsonText.match(/\[[\s\S]*\]/);
        if (!jsonMatch) {
          throw new Error('لم يتم العثور على JSON في الاستجابة');
        }
        
        const questions = JSON.parse(jsonMatch[0]);
        
        // التحقق
        if (!Array.isArray(questions) || questions.length !== 6) {
          throw new Error(`عدد الأسئلة ${questions.length} بدلاً من 6`);
        }
        
        for (const q of questions) {
          if (!q.number || !q.question || !q.type) {
            throw new Error('تنسيق السؤال غير صحيح');
          }
        }
        
        return questions;
        
      } catch (error) {
        console.error('Generation Error:', error);
        throw error;
      }
    }

    function displayQuestions(questions) {
      const html = `
        <div class="mt-6 bg-green-50 border-2 border-green-200 rounded-xl p-6">
          <h3 class="text-lg font-bold text-green-900 mb-4">✅ الأسئلة المولدة</h3>
          <div class="space-y-3">
            ${questions.map(q => `
              <div class="bg-white rounded-lg p-4 border border-green-200">
                <span class="font-bold text-indigo-600">${q.number}.</span>
                <span class="text-gray-800">${q.question}</span>
                <span class="text-xs text-gray-500 mr-2">(${q.type === 'short' ? 'قصير' : 'تحليل'})</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('status').insertAdjacentHTML('beforeend', html);
    }

    function showStatus(message, type) {
      const statusDiv = document.getElementById('status');
      const colors = {
        info: 'bg-blue-50 border-blue-200 text-blue-800',
        success: 'bg-green-50 border-green-200 text-green-800',
        error: 'bg-red-50 border-red-200 text-red-800'
      };
      statusDiv.className = `mt-6 p-4 rounded-lg border-2 ${colors[type]}`;
      statusDiv.textContent = message;
      statusDiv.classList.remove('hidden');
    }

    // Load API key if saved
    if (deepseekApiKey) {
      document.getElementById('deepseek-api-key').placeholder = '✓ المفتاح محفوظ';
    }

    loadLessons();
  </script>
</body>
</html>
