<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة طالب إلى قاعدة البيانات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-3xl font-bold text-indigo-700 mb-6 text-center">👤 إضافة طالب جديد</h1>
    
    <form id="addStudentForm" class="space-y-4">
      <div>
        <label class="block text-gray-700 font-semibold mb-2">رقم الجوال</label>
        <input 
          type="tel" 
          id="mobile" 
          placeholder="966501234567" 
          class="w-full border border-gray-300 rounded-lg p-3 text-center focus:ring-2 focus:ring-indigo-500"
          required
        />
        <p class="text-xs text-gray-500 mt-1">مثال: 966501234567 أو 0501234567</p>
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">الاسم</label>
        <input 
          type="text" 
          id="name" 
          placeholder="محمد أحمد" 
          class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500"
          required
        />
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">الصف</label>
        <input 
          type="text" 
          id="class" 
          placeholder="الأول الثانوي" 
          class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500"
          required
        />
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">Chat ID (اختياري - للتليجرام)</label>
        <input 
          type="text" 
          id="chatId" 
          placeholder="123456789" 
          class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500"
        />
        <p class="text-xs text-gray-500 mt-1">اتركه فارغاً إذا لم تكن تستخدم Telegram OTP</p>
      </div>

      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition"
      >
        ➕ إضافة الطالب
      </button>
    </form>

    <div id="status" class="mt-4"></div>

    <div class="mt-8 pt-6 border-t border-gray-200">
      <h2 class="text-lg font-bold text-gray-800 mb-3">📋 الطلاب المسجلين</h2>
      <div id="studentsList" class="space-y-2 max-h-64 overflow-y-auto">
        <p class="text-gray-500 text-sm">جارٍ التحميل...</p>
      </div>
      <button 
        onclick="loadStudents()" 
        class="w-full mt-3 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-4 rounded-lg transition text-sm"
      >
        🔄 تحديث القائمة
      </button>
    </div>
  </div>

  <script>
    // إعدادات Supabase
    const SUPABASE_URL = 'https://kzbbjtchszrngeaopcif.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YmJqdGNoc3pybmdlYW9wY2lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzAyMDQwNDUsImV4cCI6MjA0NTc4MDA0NX0.7uDUHkk_bD6cgCVx0Ig0K_Sko1NbMfFgZIe8zE1oEMY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // تطبيع رقم الجوال
    function normalizeMobile(mobile) {
      let normalized = (mobile || '').trim().replace(/\s+/g, '');
      // إذا بدأ بـ +966 -> 966
      if (normalized.startsWith('+966')) normalized = '966' + normalized.slice(4);
      // إذا بدأ بـ 00966 -> 966
      else if (normalized.startsWith('00966')) normalized = '966' + normalized.slice(5);
      // إذا بدأ بـ 05 -> 9665
      else if (normalized.startsWith('05')) normalized = '9665' + normalized.slice(1);
      // إذا بدأ بـ 5 -> 9665
      else if (normalized.startsWith('5') && normalized.length === 9) normalized = '966' + normalized;
      return normalized;
    }

    // عرض رسالة الحالة
    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      const colors = {
        success: 'bg-green-50 border-green-200 text-green-800',
        error: 'bg-red-50 border-red-200 text-red-800',
        info: 'bg-blue-50 border-blue-200 text-blue-800'
      };
      const color = colors[type] || colors.info;
      statusDiv.innerHTML = `
        <div class="${color} border rounded-lg p-3">
          <p class="text-sm font-semibold">${message}</p>
        </div>`;
    }

    // إضافة طالب
    document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const mobile = normalizeMobile(document.getElementById('mobile').value);
      const name = document.getElementById('name').value.trim();
      const studentClass = document.getElementById('class').value.trim();
      const chatId = document.getElementById('chatId').value.trim();

      if (!mobile || !name || !studentClass) {
        showStatus('⚠️ يرجى ملء الحقول المطلوبة', 'error');
        return;
      }

      showStatus('⏳ جارٍ إضافة الطالب...', 'info');

      try {
        // إضافة الطالب
        const { data: studentData, error: studentError } = await supabase
          .from('students')
          .upsert({
            mobile,
            name,
            class: studentClass
          }, { onConflict: 'mobile' })
          .select()
          .single();

        if (studentError) {
          showStatus('❌ خطأ في إضافة الطالب: ' + studentError.message, 'error');
          console.error(studentError);
          return;
        }

        // إضافة chat_id إذا تم إدخاله
        if (chatId) {
          const { error: chatError } = await supabase
            .from('telegram_chats')
            .upsert({
              chat_id: parseInt(chatId),
              student_mobile: mobile
            }, { onConflict: 'chat_id' });

          if (chatError) {
            showStatus('⚠️ تم إضافة الطالب لكن فشل حفظ Chat ID: ' + chatError.message, 'error');
            console.error(chatError);
            return;
          }
          showStatus(`✅ تم إضافة الطالب و Chat ID بنجاح! رقم الجوال: ${mobile}`, 'success');
        } else {
          showStatus(`✅ تم إضافة الطالب بنجاح! رقم الجوال: ${mobile}`, 'success');
        }

        document.getElementById('addStudentForm').reset();
        loadStudents();
      } catch (err) {
        showStatus('❌ خطأ: ' + (err.message || 'خطأ غير معروف'), 'error');
        console.error(err);
      }
    });

    // تحميل قائمة الطلاب
    async function loadStudents() {
      const listDiv = document.getElementById('studentsList');
      listDiv.innerHTML = '<p class="text-gray-500 text-sm">جارٍ التحميل...</p>';

      try {
        const { data, error } = await supabase
          .from('students')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          listDiv.innerHTML = `<p class="text-red-500 text-sm">❌ ${error.message}</p>`;
        } else if (data.length === 0) {
          listDiv.innerHTML = '<p class="text-gray-500 text-sm">لا يوجد طلاب مسجلين</p>';
        } else {
          listDiv.innerHTML = data.map(student => `
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-3">
              <p class="font-semibold text-gray-800">${student.name}</p>
              <p class="text-sm text-gray-600">📱 ${student.mobile}</p>
              <p class="text-sm text-gray-600">📚 ${student.class}</p>
            </div>
          `).join('');
        }
      } catch (err) {
        listDiv.innerHTML = `<p class="text-red-500 text-sm">❌ ${err.message}</p>`;
      }
    }

    // تحميل الطلاب عند بدء الصفحة
    window.addEventListener('load', loadStudents);
  </script>
</body>
</html>
