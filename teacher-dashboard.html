  <script>
    const SUPABASE_URL = 'https://vtvewxxokrrwrwlubpkr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dmV3eHhva3Jyd3J3bHVicGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzMDMxNDUsImV4cCI6MjA3Njg3OTE0NX0.rp9ip1WjNK70Bc0eN218Yo_goSlcxWerTQFBnV0iRFQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allStudents = [];
    let allClasses = {};

    async function loadAllData() {
      await Promise.all([
        loadStatistics(),
        loadClasses(),
        loadStudents()
      ]);
    }

    async function loadStatistics() {
      try {
        // إجمالي الطلاب
        const { count: studentsCount } = await supabase
          .from('students')
          .select('*', { count: 'exact', head: true });
        document.getElementById('totalStudents').textContent = studentsCount || 0;

        // الطلاب المرتبطون بتليجرام
        const { count: telegramCount } = await supabase
          .from('telegram_chats')
          .select('*', { count: 'exact', head: true });
        document.getElementById('totalTelegram').textContent = telegramCount || 0;

        // المهام المكتملة
        const { count: progressCount } = await supabase
          .from('progress')
          .select('*', { count: 'exact', head: true });
        document.getElementById('totalProgress').textContent = progressCount || 0;
      } catch (error) {
        console.error('Error loading statistics:', error);
      }
    }

    async function loadClasses() {
      try {
        const { data: students, error } = await supabase
          .from('students')
          .select('class')
          .order('class');

        if (error) throw error;

        // تجميع الطلاب حسب الفصل
        allClasses = {};
        students.forEach(student => {
          const className = student.class || 'غير محدد';
          if (!allClasses[className]) {
            allClasses[className] = 0;
          }
          allClasses[className]++;
        });

        // عرض عدد الفصول
        document.getElementById('totalClasses').textContent = Object.keys(allClasses).length;

        // عرض بطاقات الفصول
        const classesContainer = document.getElementById('classesContainer');
        const colors = ['indigo', 'green', 'blue', 'purple', 'pink', 'orange'];
        
        if (Object.keys(allClasses).length === 0) {
          classesContainer.innerHTML = '<p class="text-gray-500 col-span-3 text-center py-8">لا توجد فصول بعد</p>';
          return;
        }

        classesContainer.innerHTML = Object.keys(allClasses).sort().map((className, index) => {
          const color = colors[index % colors.length];
          return `
            <div class="bg-gradient-to-br from-${color}-50 to-${color}-100 border-2 border-${color}-200 rounded-xl p-6 hover:shadow-lg transition cursor-pointer"
                 onclick="showClassStudents('${className}')">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-${color}-900">${className}</h3>
                <div class="bg-${color}-200 p-3 rounded-full">
                  <span class="text-2xl">📚</span>
                </div>
              </div>
              <div class="flex items-center justify-between">
                <p class="text-${color}-700 font-semibold">عدد الطلاب:</p>
                <p class="text-3xl font-bold text-${color}-900">${allClasses[className]}</p>
              </div>
              <div class="mt-4 pt-4 border-t border-${color}-300">
                <button class="w-full bg-${color}-600 hover:bg-${color}-700 text-white py-2 rounded-lg font-semibold transition text-sm">
                  عرض التفاصيل →
                </button>
              </div>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.error('Error loading classes:', error);
        document.getElementById('classesContainer').innerHTML = 
          '<p class="text-red-500 col-span-3 text-center">❌ خطأ في تحميل الفصول</p>';
      }
    }

    async function loadStudents() {
      try {
        const { data: students, error } = await supabase
          .from('students')
          .select('*')
          .order('class', { ascending: true })
          .order('name', { ascending: true });

        if (error) throw error;

        allStudents = students || [];

        // جلب معلومات التليجرام
        const { data: telegramChats } = await supabase
          .from('telegram_chats')
          .select('mobile, chat_id');

        const telegramMap = {};
        (telegramChats || []).forEach(chat => {
          telegramMap[chat.mobile] = chat.chat_id;
        });

        displayStudents(allStudents, telegramMap);
      } catch (error) {
        console.error('Error loading students:', error);
        document.getElementById('studentsTable').innerHTML = 
          '<p class="text-red-500 text-center py-4">❌ خطأ في تحميل الطلاب</p>';
      }
    }

    function displayStudents(students, telegramMap = {}) {
      const tableDiv = document.getElementById('studentsTable');
      
      if (students.length === 0) {
        tableDiv.innerHTML = '<p class="text-gray-500 text-center py-8">لا يوجد طلاب</p>';
        return;
      }

      const tableHTML = `
        <table class="min-w-full">
          <thead class="bg-gray-50 border-b-2 border-gray-200">
            <tr>
              <th class="px-4 py-3 text-right text-sm font-bold text-gray-700">الاسم</th>
              <th class="px-4 py-3 text-right text-sm font-bold text-gray-700">رقم الجوال</th>
              <th class="px-4 py-3 text-right text-sm font-bold text-gray-700">الصف</th>
              <th class="px-4 py-3 text-center text-sm font-bold text-gray-700">تليجرام</th>
              <th class="px-4 py-3 text-center text-sm font-bold text-gray-700">الإجراءات</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            ${students.map(student => `
              <tr class="hover:bg-gray-50 transition">
                <td class="px-4 py-3">
                  <span class="font-semibold text-gray-800">${student.name}</span>
                </td>
                <td class="px-4 py-3 text-gray-600 font-mono text-sm">${student.mobile}</td>
                <td class="px-4 py-3">
                  <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-semibold">
                    ${student.class}
                  </span>
                </td>
                <td class="px-4 py-3 text-center">
                  ${telegramMap[student.mobile] ? 
                    '<span class="text-green-600 text-xl" title="مرتبط">✓</span>' : 
                    '<span class="text-gray-400 text-xl" title="غير مرتبط">✗</span>'}
                </td>
                <td class="px-4 py-3 text-center">
                  <button onclick="viewStudentDetails('${student.mobile}')" 
                          class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-semibold transition">
                    📊 التفاصيل
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      
      tableDiv.innerHTML = tableHTML;
    }

    function filterStudents() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allStudents.filter(student => 
        student.name.toLowerCase().includes(searchTerm) ||
        student.mobile.includes(searchTerm) ||
        student.class.toLowerCase().includes(searchTerm)
      );
      displayStudents(filtered);
    }

    function updateBreadcrumb(path) {

    async function showPerformanceReport(className, lessonId) {
      hideAllViews();
      currentClass = className;
      currentLesson = lessonId;

      document.getElementById('performanceReportContent').innerHTML = `
        <div class="text-center py-16">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
          <p class="mt-4 text-gray-600">جارٍ تحميل الكشف...</p>
        </div>`;
      document.getElementById('performanceReportView').classList.remove('hidden');

      try {
        // جلب الطلاب
        const { data: students, error: studentsError } = await supabase
          .from('students')
          .select('*')
          .eq('class', className)
          .order('name');

        if (studentsError) throw studentsError;

        if (!students || students.length === 0) {
          document.getElementById('performanceReportContent').innerHTML = `
            <div class="text-center py-16 text-gray-500">
              <div class="text-6xl mb-4">👥</div>
              <p class="text-lg font-semibold">لا يوجد طلاب في فصل "${className}"</p>
              <button onclick="showClassManagement('${className}')" 
                      class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold transition">
                ← العودة للفصل
              </button>
            </div>`;
          return;
        }

        // جلب الدرس
        const { data: lesson, error: lessonError } = await supabase
          .from('lessons')
          .select('*')
          .eq('id', lessonId)
          .single();

        if (lessonError) throw lessonError;

        // جلب التقدم
        const { data: progress, error: progressError } = await supabase
          .from('progress')
          .select('*')
          .eq('lesson_id', lessonId);

        if (progressError) throw progressError;

        // بناء خريطة التقدم
        const progressMap = {};
        (progress || []).forEach(p => {
          if (!progressMap[p.student_mobile]) {
            progressMap[p.student_mobile] = {};
          }
          progressMap[p.student_mobile][p.task] = true;
        });

        // حساب الإحصائيات
        const stats = {};
        TASKS.forEach(task => stats[task.id] = 0);
        students.forEach(student => {
          const studentProgress = progressMap[student.mobile] || {};
          TASKS.forEach(task => {
            if (studentProgress[task.id]) stats[task.id]++;
          });
        });

        const content = `
          <!-- الإحصائيات -->
          <div class="mb-6">
            <button onclick="showPerformanceLessons('${className}')" 
                    class="mb-4 flex items-center gap-2 text-indigo-600 hover:text-indigo-800 font-semibold transition">
              <span>←</span>
              <span>العودة للدروس</span>
            </button>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">📊 كشف المهام الأدائية</h2>
            <p class="text-gray-600 mb-4">الفصل: ${className} | الدرس ${lessonId}: ${lesson.title}</p>
            
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
              ${TASKS.map(task => {
                const percent = students.length > 0 ? Math.round((stats[task.id] / students.length) * 100) : 0;
                return `
                  <div class="bg-white rounded-xl shadow-md p-4 text-center">
                    <div class="text-3xl mb-2">${task.icon}</div>
                    <p class="text-xs text-gray-600 mb-1">${task.name}</p>
                    <p class="text-xl font-bold text-indigo-600">${stats[task.id]}/${students.length}</p>
                    <p class="text-xs text-gray-500">${percent}%</p>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- الجدول -->
          <div class="bg-white rounded-xl shadow-md p-6">
            <div class="overflow-x-auto">
              <table class="min-w-full border-collapse">
                <thead>
                  <tr class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                    <th class="border border-gray-300 px-4 py-3 text-right font-bold">م</th>
                    <th class="border border-gray-300 px-4 py-3 text-right font-bold">الطالب</th>
                    ${TASKS.map(task => `
                      <th class="border border-gray-300 px-3 py-3 text-center font-bold">
                        <div class="flex flex-col items-center gap-1">
                          <span class="text-xl">${task.icon}</span>
                          <span class="text-xs">${task.name}</span>
                        </div>
                      </th>
                    `).join('')}
                    <th class="border border-gray-300 px-4 py-3 text-center font-bold">المجموع</th>
                  </tr>
                </thead>
                <tbody>
                  ${students.map((student, index) => {
                    const studentProgress = progressMap[student.mobile] || {};
                    const completedTasks = TASKS.filter(task => studentProgress[task.id]).length;
                    const percent = Math.round((completedTasks / TASKS.length) * 100);
                    
                    return `
                      <tr class="hover:bg-gray-50 transition ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}">
                        <td class="border border-gray-300 px-4 py-3 text-center font-semibold">${index + 1}</td>
                        <td class="border border-gray-300 px-4 py-3 font-semibold">${student.name}</td>
                        ${TASKS.map(task => {
                          const completed = studentProgress[task.id];
                          return `
                            <td class="border border-gray-300 px-3 py-3 text-center">
                              <span class="text-2xl ${completed ? 'text-green-600' : 'text-red-400'}">
                                ${completed ? '✅' : '❌'}
                              </span>
                            </td>
                          `;
                        }).join('')}
                        <td class="border border-gray-300 px-4 py-3 text-center">
                          <div class="flex flex-col items-center">
                            <span class="text-lg font-bold ${percent >= 80 ? 'text-green-600' : percent >= 50 ? 'text-orange-600' : 'text-red-600'}">
                              ${completedTasks}/${TASKS.length}
                            </span>
                            <span class="text-xs text-gray-600">${percent}%</span>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
                <tfoot>
                  <tr class="bg-gray-100 font-bold">
                    <td colspan="2" class="border border-gray-300 px-4 py-3 text-right">الإجمالي</td>
                    ${TASKS.map(task => {
                      const completed = stats[task.id];
                      const percent = students.length > 0 ? Math.round((completed / students.length) * 100) : 0;
                      return `
                        <td class="border border-gray-300 px-3 py-3 text-center">
                          <div class="flex flex-col items-center">
                            <span class="text-sm">${completed}/${students.length}</span>
                            <span class="text-xs text-gray-600">${percent}%</span>
                          </div>
                        </td>
                      `;
                    }).join('')}
                    <td class="border border-gray-300 px-4 py-3 text-center text-indigo-600 text-lg">
                      ${students.length > 0 ? Math.round((students.reduce((sum, s) => sum + TASKS.filter(t => progressMap[s.mobile]?.[t.id]).length, 0) / (students.length * TASKS.length)) * 100) : 0}%
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>

          <!-- أزرار التصدير -->
          <div class="mt-6 flex gap-4 justify-end">
            <button onclick="window.print()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold transition">
              🖨️ طباعة
            </button>
          </div>
        `;

        document.getElementById('performanceReportContent').innerHTML = content;
        updateBreadcrumb(`
          <span class="cursor-pointer hover:text-indigo-600" onclick="showDashboard()">الرئيسية</span>
          <span class="text-gray-400">←</span>
          <span class="cursor-pointer hover:text-indigo-600" onclick="showClassManagement('${className}')">${className}</span>
          <span class="text-gray-400">←</span>
          <span class="cursor-pointer hover:text-indigo-600" onclick="showPerformanceLessons('${className}')">كشف المهام</span>
          <span class="text-gray-400">←</span>
          <span class="text-indigo-600 font-semibold">الدرس ${lessonId}</span>
        `);
        window.scrollTo(0, 0);

      } catch (error) {
        console.error('Error loading report:', error);
        document.getElementById('performanceReportContent').innerHTML = `
          <div class="text-center py-16 text-red-500">
            <div class="text-6xl mb-4">❌</div>
            <p class="text-lg font-semibold">خطأ في تحميل الكشف</p>
            <p class="text-sm mt-2 text-gray-600">${error.message || 'خطأ غير معروف'}</p>
            <button onclick="showPerformanceLessons('${className}')" 
                    class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold transition">
              ← العودة للدروس
            </button>
          </div>`;
      }
    }
