# ════════════════════════════════════════════════════════════
# Netlify Configuration
# ════════════════════════════════════════════════════════════

[build]
  # لا يوجد build command لأننا نستخدم HTML مباشرة
  publish = "."
  functions = "netlify/functions"

# إعادة توجيه لصفحة index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  
# Headers للأمان
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache للملفات الثابتة
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Service Worker - يجب عدم تخزينه مؤقتاً
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"

# Environment variables (أضف TELEGRAM_BOT_TOKEN في Netlify Dashboard)
# لا تضع التوكن هنا! استخدم Netlify Dashboard
